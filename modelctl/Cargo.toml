[package]
name = "modelctl"
version = "0.1.0"
edition = "2021"
description = "Keyboard-driven TUI to manage the LLM models llama-swap serves to the homelab (lab3)"
license = "MIT"

[[bin]]
name = "modelctl"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 2
strip = true
