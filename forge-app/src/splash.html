<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge</title>
<style>
/* Forge opening screen — "the forge mouth": charcoal dark, an ember glow
   that rises as each startup stage completes, cold steel when something
   fails. Fonts are macOS built-ins so it renders offline. */
:root {
  --bg: #0c0a08;
  --bg-2: #15110d;
  --fg: #f1e9dc;
  --muted: #8f8577;
  --faint: #3a322a;
  --line: #241e18;
  --ember: #ff7a2f;
  --ember-hot: #ffb257;
  --ember-deep: #c2410c;
  --gold: #e3b450;
  --steel: #7b8794;
  --steel-deep: #3d4651;
  --glow: rgba(255, 105, 35, 0.42);
  --display: "Avenir Next Condensed", "Avenir Next", "Helvetica Neue", sans-serif;
  --body: "Avenir Next", "Helvetica Neue", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #ece6dc;
    --bg-2: #e3dbcf;
    --fg: #1c1712;
    --muted: #6f6558;
    --faint: #c9bfb1;
    --line: #d5ccbe;
    --ember: #d9531a;
    --ember-hot: #f08a3a;
    --ember-deep: #a3360b;
    --gold: #b8861f;
    --steel: #5d6875;
    --steel-deep: #aab3bd;
    --glow: rgba(230, 95, 30, 0.18);
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.55 var(--body);
  -webkit-user-select: none;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

/* --- atmosphere ------------------------------------------------------- */
.mouth {
  position: fixed; inset: auto -20% -45% -20%; height: 100%;
  background: radial-gradient(ellipse at 50% 100%, var(--glow) 0%, transparent 66%);
  pointer-events: none;
  transition: opacity 900ms ease, transform 900ms ease;
  animation: breathe 5.5s ease-in-out infinite;
}
body[data-step="key"]  .mouth { opacity: .35; transform: translateY(14%); }
body[data-step="tap"]  .mouth { opacity: .55; transform: translateY(9%); }
body[data-step="lab3"] .mouth { opacity: .8;  transform: translateY(4%); }
body[data-step="harness"] .mouth { opacity: 1; transform: none; }
body[data-mode="error"] .mouth { opacity: .12; animation: none; filter: grayscale(1); }
@keyframes breathe { 50% { filter: brightness(1.18); } }

.grain {
  position: fixed; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.rules {
  position: fixed; inset: 0; pointer-events: none;
  background:
    linear-gradient(var(--line), var(--line)) 56px 0 / 1px 100% no-repeat,
    linear-gradient(var(--line), var(--line)) calc(100% - 56px) 0 / 1px 100% no-repeat;
  opacity: .7;
}

/* --- chrome ----------------------------------------------------------- */
header, footer {
  position: relative;
  display: flex; justify-content: space-between; align-items: baseline;
  padding: 26px 80px;
  font: 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase;
  color: var(--muted);
}
header b { color: var(--fg); font-weight: 600; }
footer { padding-bottom: 30px; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--ember); margin-right: 9px; vertical-align: 1px;
  box-shadow: 0 0 10px var(--ember); }
body[data-mode="error"] .dot { background: var(--steel); box-shadow: none; }

/* --- main stage ------------------------------------------------------- */
main {
  position: relative;
  display: grid; grid-template-columns: minmax(0, 1fr) 300px;
  align-items: center; gap: 56px;
  padding: 0 80px; max-width: 1180px; width: 100%; margin: 0 auto;
}
.word {
  font: 800 clamp(96px, 15vw, 188px)/.82 var(--display);
  letter-spacing: -.01em; text-transform: uppercase;
  /* room above the cap height so background-clip:text doesn't shave the tops */
  padding: .14em .04em .02em 0; margin: -.14em 0 0;
  background: linear-gradient(180deg, var(--fg) 30%, var(--ember-hot) 78%, var(--ember-deep) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: rise 900ms cubic-bezier(.2,.7,.1,1) both;
}
body[data-mode="error"] .word {
  background: linear-gradient(180deg, var(--fg) 30%, var(--steel) 100%);
  -webkit-background-clip: text; background-clip: text;
}
.tag {
  margin: 18px 0 44px 6px; color: var(--muted);
  font: 13px/1.4 var(--mono); letter-spacing: .06em;
  animation: rise 900ms 120ms cubic-bezier(.2,.7,.1,1) both;
}

.status {
  margin: 0 0 0 4px; min-height: 2.6em; max-width: 34ch;
  font: 500 22px/1.3 var(--body); letter-spacing: -.005em;
  animation: rise 900ms 220ms cubic-bezier(.2,.7,.1,1) both;
}
.status em { font-style: normal; color: var(--gold); }

/* the heat bar: one segment per startup stage */
.heat {
  list-style: none; margin: 34px 0 0 4px; padding: 0;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 560px;
  animation: rise 900ms 320ms cubic-bezier(.2,.7,.1,1) both;
}
.heat li { font: 10.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--faint); transition: color .4s; }
.heat .bar { display: block; height: 4px; border-radius: 2px; background: var(--line); margin-bottom: 11px; overflow: hidden; position: relative; }
.heat .bar::after { content: ""; position: absolute; inset: 0; transform: scaleX(0); transform-origin: left;
  background: linear-gradient(90deg, var(--ember-deep), var(--ember), var(--ember-hot)); transition: transform .7s cubic-bezier(.2,.7,.1,1); }
.heat li.done { color: var(--muted); }
.heat li.done .bar::after { transform: scaleX(1); }
.heat li.active { color: var(--fg); }
.heat li.active .bar::after { transform: scaleX(1); background-size: 300% 100%;
  background-image: linear-gradient(90deg, transparent, var(--ember) 40%, var(--ember-hot) 50%, var(--ember) 60%, transparent);
  animation: shimmer 1.4s linear infinite; }
.heat li.failed { color: var(--steel); }
.heat li.failed .bar::after { transform: scaleX(1); background: var(--steel-deep); }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }

/* --- emblem ----------------------------------------------------------- */
.emblem { position: relative; width: 300px; height: 300px; animation: rise 1100ms 180ms cubic-bezier(.2,.7,.1,1) both; }
.emblem svg { width: 100%; height: 100%; overflow: visible; }
.emblem g { opacity: 0; transition: opacity .5s ease; }
body[data-step="key"]  .emblem .g-wait,
body[data-step="tap"]  .emblem .g-tap,
body[data-step="lab3"] .emblem .g-heat,
body[data-step="harness"] .emblem .g-heat { opacity: 1; }
body[data-mode="error"] .emblem g { opacity: 0 !important; }
body[data-mode="error"] .emblem .g-cold { opacity: 1 !important; }

.g-wait .orbit { transform-origin: 150px 150px; animation: spin 14s linear infinite; }
.g-tap .ring { transform-origin: 150px 150px; animation: blink 1.1s ease-in-out infinite; }
.g-tap .ring2 { transform-origin: 150px 150px; animation: blink 1.1s 0.55s ease-in-out infinite; }
.g-tap .contact { filter: drop-shadow(0 0 22px var(--gold)); }
.g-heat .flame { transform-origin: 150px 150px; animation: glow 2.6s ease-in-out infinite; }
body[data-step="harness"] .g-heat .flame { animation-duration: 1.2s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0% { opacity: .9; transform: scale(.86); } 70% { opacity: 0; transform: scale(1.22); } 100% { opacity: 0; } }
@keyframes glow { 50% { filter: drop-shadow(0 0 34px var(--ember)) brightness(1.15); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

.tapword { font: 700 13px var(--mono); letter-spacing: .3em; fill: var(--bg); }

/* --- error panel ------------------------------------------------------ */
.error { display: none; margin: 30px 0 0 4px; max-width: 520px;
  border-left: 2px solid var(--steel); padding: 4px 0 4px 20px; }
body[data-mode="error"] .error { display: block; animation: rise 500ms both; }
body[data-mode="error"] .status { display: none; }
.error h2 { margin: 0 0 8px; font: 700 26px/1.15 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.error p { margin: 0 0 22px; color: var(--muted); }
button {
  font: 600 13px var(--mono); letter-spacing: .16em; text-transform: uppercase;
  padding: 13px 28px; border-radius: 3px; border: 0; cursor: pointer;
  color: #160b04; background: linear-gradient(180deg, var(--ember-hot), var(--ember));
  box-shadow: 0 0 0 1px var(--ember-deep) inset, 0 8px 28px -8px var(--ember);
  transition: transform .15s, box-shadow .2s;
}
button:hover { transform: translateY(-1px); box-shadow: 0 0 0 1px var(--ember-deep) inset, 0 12px 34px -8px var(--ember); }
button:active { transform: translateY(1px); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

@media (max-width: 900px) {
  main { grid-template-columns: 1fr; gap: 10px; }
  .emblem { display: none; }
  header, footer, main { padding-left: 40px; padding-right: 40px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body data-step="{{STEP}}" data-mode="{{MODE}}">
<div class="mouth"></div><div class="rules"></div><div class="grain"></div>

<header>
  <span><span class="dot"></span><b>Forge</b> &nbsp;·&nbsp; coding agent</span>
  <span>lab3 · local · offline</span>
</header>

<main>
  <section>
    <h1 class="word">Forge</h1>
    <p class="tag">KAT-Coder V2.5 on lab3 &nbsp;/&nbsp; DeepSeek Harness</p>

    <p class="status" id="status">{{STATUS}}</p>

    <div class="error">
      <h2>{{ERR_TITLE}}</h2>
      <p>{{ERR_DETAIL}}</p>
      <button onclick="window.ipc.postMessage('retry')">{{BUTTON}}</button>
    </div>

    <ol class="heat" id="heat">
      <li data-s="key"><span class="bar"></span>01 · Key</li>
      <li data-s="tap"><span class="bar"></span>02 · Tap</li>
      <li data-s="lab3"><span class="bar"></span>03 · lab3</li>
      <li data-s="harness"><span class="bar"></span>04 · Harness</li>
    </ol>
  </section>

  <div class="emblem" aria-hidden="true">
    <svg viewBox="0 0 300 300">
      <defs>
        <radialGradient id="gold" cx="45%" cy="40%" r="65%">
          <stop offset="0" stop-color="#fff1c4"/><stop offset=".45" stop-color="#e9bd5c"/><stop offset="1" stop-color="#9c6d1a"/>
        </radialGradient>
        <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffd08a"/><stop offset=".5" stop-color="#ff7a2f"/><stop offset="1" stop-color="#9a2d07"/>
        </linearGradient>
        <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#aeb8c3"/><stop offset="1" stop-color="#4a5562"/>
        </linearGradient>
      </defs>

      <!-- waiting for the key to be plugged in -->
      <g class="g-wait">
        <circle cx="150" cy="150" r="56" fill="none" stroke="var(--faint)" stroke-width="2"/>
        <circle class="orbit" cx="150" cy="150" r="96" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="2 11" stroke-linecap="round"/>
        <rect x="132" y="196" width="36" height="22" rx="4" fill="none" stroke="var(--muted)" stroke-width="2"/>
        <path d="M150 218 v26" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- tap: mirrors the YubiKey's gold contact, blinking like the key does -->
      <g class="g-tap">
        <circle class="ring"  cx="150" cy="150" r="92" fill="none" stroke="var(--gold)" stroke-width="2"/>
        <circle class="ring2" cx="150" cy="150" r="92" fill="none" stroke="var(--gold)" stroke-width="1.2"/>
        <circle class="contact" cx="150" cy="150" r="58" fill="url(#gold)"/>
        <circle cx="150" cy="150" r="58" fill="none" stroke="#fff4d0" stroke-opacity=".5" stroke-width="1"/>
        <text class="tapword" x="150" y="155" text-anchor="middle">TAP</text>
      </g>

      <!-- heating: the Forge flame, glowing hotter as it starts
           (24-unit paths shared with the web UI mark, scaled 9x) -->
      <g class="g-heat">
        <path class="flame" fill="url(#ember)"
              d="M150 57.2
              C158.1 87.8 182.4 104 198.6 127.4
              C209.4 142.7 214.8 159.8 214.8 177.8
              C214.8 214.7 186 242.6 150 242.6
              C114 242.6 85.2 214.7 85.2 179.6
              C85.2 157.1 96 139.1 111.3 125.6
              C112.2 140 118.5 151.7 128.4 158
              C124.8 121.1 135.6 86 150 57.2 Z"/>
        <path fill="#ffe2b0" fill-opacity=".9"
              d="M152.7 136.4
              C157.2 158 171.6 168.8 178.8 183.2
              C182.4 189.5 184.2 195.8 184.2 202.1
              C184.2 221 168.9 234.5 150 234.5
              C131.1 234.5 115.8 221 115.8 203
              C115.8 190.4 122.1 180.5 131.1 174.2
              C132 182.3 135.6 188.6 141 192.2
              C139.2 172.4 143.7 152.6 152.7 136.4 Z"/>
      </g>

      <!-- quenched: something stopped -->
      <g class="g-cold">
        <path fill="url(#steel)" opacity=".85"
              d="M150 57.2
              C158.1 87.8 182.4 104 198.6 127.4
              C209.4 142.7 214.8 159.8 214.8 177.8
              C214.8 214.7 186 242.6 150 242.6
              C114 242.6 85.2 214.7 85.2 179.6
              C85.2 157.1 96 139.1 111.3 125.6
              C112.2 140 118.5 151.7 128.4 158
              C124.8 121.1 135.6 86 150 57.2 Z"/>
        <path fill="var(--bg)" fill-opacity=".45"
              d="M152.7 136.4
              C157.2 158 171.6 168.8 178.8 183.2
              C182.4 189.5 184.2 195.8 184.2 202.1
              C184.2 221 168.9 234.5 150 234.5
              C131.1 234.5 115.8 221 115.8 203
              C115.8 190.4 122.1 180.5 131.1 174.2
              C132 182.3 135.6 188.6 141 192.2
              C139.2 172.4 143.7 152.6 152.7 136.4 Z"/>
      </g>
    </svg>
  </div>
</main>

<footer>
  <span>Log · ~/.forge/app.log</span>
  <span>⌘Q quit &nbsp;·&nbsp; ⌘R reload</span>
</footer>

<script>
const ORDER = ["key", "tap", "lab3", "harness"];
function paint(step, mode) {
  document.body.dataset.step = step;
  document.body.dataset.mode = mode;
  const at = ORDER.indexOf(step);
  document.querySelectorAll("#heat li").forEach((li, i) => {
    li.className = i < at ? "done" : i === at ? (mode === "error" ? "failed" : "active") : "";
  });
}
// Called from the app as each stage starts.
window.setStep = (step, text) => {
  paint(step, "work");
  const s = document.getElementById("status");
  s.innerHTML = "";
  // Highlight the instruction for the physical key in gold.
  const m = text.match(/^(Tap your YubiKey|Plug in your YubiKey)(.*)$/);
  if (m) { const em = document.createElement("em"); em.textContent = m[1]; s.append(em, m[2]); }
  else s.textContent = text;
};
if (document.body.dataset.mode === "work") {
  window.setStep(document.body.dataset.step, document.getElementById("status").textContent);
} else {
  paint(document.body.dataset.step, document.body.dataset.mode);
}
</script>
</body>
</html>
