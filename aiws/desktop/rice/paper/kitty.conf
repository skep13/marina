# Miku theme for kitty — palette from the wallpaper

# Menlo on the Mac; DejaVu Sans Mono is what Menlo was drawn from
font_family      DejaVu Sans Mono
font_size        13.0
disable_ligatures always

# window
remember_window_size  no
initial_window_width  100c
initial_window_height 28c
window_padding_width  12 16
# keep the title bar so close / minimise / full-screen buttons show
# Hyprland draws the border; on the Mac the title bar was background-coloured
hide_window_decorations yes
background_opacity 0.97
background_blur 0
# zsh even though CachyOS and Caelestia default to fish
shell zsh
confirm_os_window_close 0

# keep memory and battery use low
scrollback_lines 5000
repaint_delay 10
input_delay 3
sync_to_monitor yes
cursor_blink_interval 0
enable_audio_bell no

# tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
# paper theme: colours from the wallpaper (palette.json)
active_tab_foreground   #f6f4f1
active_tab_background   #4c6838
inactive_tab_foreground #7b716f
inactive_tab_background #e7e1df
tab_bar_background      #ece8e4
foreground           #3a312b
background           #f6f4f1
selection_foreground #2e2620
selection_background #d8e0cf
cursor               #4c6838
cursor_text_color    #f6f4f1
url_color            #4c6838
active_border_color  #4c6838
inactive_border_color #c7c2c2
# black / grey
color0  #3a312b
color8  #7b716f
# red: the face marks
color1  #a43c35
color9  #bf443c
# green: her eyes
color2  #4c6838
color10 #5a7c49
# yellow: the brass staff
color3  #8a6d2b
color11 #b09b50
# blue: a muted slate (the painting has none)
color4  #4f5d6b
color12 #6b7a89
# magenta: dusty rose from her skin tones
color5  #8f5a5f
color13 #a87478
# cyan: sage-teal
color6  #4a6b63
color14 #6a8a80
# white
color7  #d9d3d1
color15 #f6f4f1
