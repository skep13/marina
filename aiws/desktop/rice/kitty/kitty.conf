# Miku theme for kitty — palette from the wallpaper

# Menlo on the Mac; DejaVu Sans Mono is what Menlo was drawn from
font_family      DejaVu Sans Mono
font_size        13.0
disable_ligatures always

# window
remember_window_size  no
initial_window_width  100c
initial_window_height 28c
window_padding_width  12 16
# keep the title bar so close / minimise / full-screen buttons show
# Hyprland draws the border; on the Mac the title bar was background-coloured
hide_window_decorations yes
background_opacity 0.96
background_blur 0
# zsh even though CachyOS and Caelestia default to fish
shell zsh
confirm_os_window_close 0

# keep memory and battery use low
scrollback_lines 5000
repaint_delay 10
input_delay 3
sync_to_monitor yes
cursor_blink_interval 0
enable_audio_bell no

# tabs
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground   #141516
active_tab_background   #7B8FE0
inactive_tab_foreground #8296E0
inactive_tab_background #1E2130
tab_bar_background      #121314

# colours
foreground           #C4CDF2
background           #141516
selection_foreground #E3E8FB
selection_background #2C3558
cursor               #7B8FE0
cursor_text_color    #141516
url_color            #8EA2EA
active_border_color  #627DC7
inactive_border_color #262D47

