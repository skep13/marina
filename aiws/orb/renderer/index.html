<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
<title>Marina</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="panel" hidden>
  <header>
    <b>MARINA</b>
    <span id="seeing" title="what she can see right now">—</span>
    <button id="watch" class="icon" title="Watch mode: keep a recent screenshot so she can see without asking">◉</button>
    <button id="gear" class="icon" title="Colours">⚙</button>
    <button id="close" class="icon" title="Collapse">⌄</button>
  </header>

  <section id="chat">
    <div id="msgs"></div>
    <div id="composer">
      <textarea id="input" rows="2" placeholder="Ask Marina… (Enter to send, Shift+Enter for a new line)"></textarea>
      <div class="row">
        <button id="look" class="toggle" title="Attach a screenshot of your screen to this message">👁 look</button>
        <span class="grow"></span>
        <button id="stop" class="danger" hidden>■ stop</button>
        <button id="doit" title="Let her do it on your computer">▶ do it</button>
        <button id="send" class="primary">send</button>
      </div>
    </div>
  </section>

  <section id="settings" hidden>
    <h3>Sphere</h3>
    <div class="grid" id="base"></div>
    <h3>States</h3>
    <div class="grid" id="states"></div>
    <div class="row"><button id="reset">reset to defaults</button><span class="grow"></span><button id="done" class="primary">done</button></div>
  </section>
</main>
<canvas id="orb" title="Marina"></canvas>
<script type="module" src="./app.js"></script>
</body>
</html>
