# Manual llama-swap entry for the embedder — use this if lab3's
# /opt/llama-swap/config.yaml is still hand-maintained (not yet generated by
# aiwsd). Merge the `models:` entry and the `resident` group into the existing
# config, then `llama-swap -validate` it and let -watch-config reload.
#
# Download the GGUF first (lab3 has curl, no hf CLI):
#   curl -fL -o /models/bge-small-en-v1.5-q8_0.gguf \
#     https://huggingface.co/CompendiumLabs/bge-small-en-v1.5-gguf/resolve/main/bge-small-en-v1.5-q8_0.gguf
#
# The served name `embed` is what rag/rag.yaml's remote_model points at.

models:
  embed:
    # ${llama} is the existing macro (llama-server --host ... --port ${PORT}).
    # --embeddings puts llama-server in embedding mode; --pooling mean matches
    # bge/sentence-transformers so Mac and lab3 vectors line up.
    cmd: >
      ${llama}
      -m /models/bge-small-en-v1.5-q8_0.gguf
      --alias embed
      --embeddings
      --pooling mean
      -c 512
      -np 1
      -ngl 999
    ttl: 0

# Keep the embedder resident so retrieval doesn't evict the chat model.
groups:
  resident:
    swap: false
    exclusive: false
    persistent: true
    members: [embed]
