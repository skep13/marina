name: Agent Room desktop app

# Builds the agent-room desktop app for Windows, macOS and Linux.
# Run it by hand (Actions → Agent Room desktop app → Run workflow), or push a
# tag like agent-room-v0.2.0 to publish the installers as a release (never marked latest).
on:
  workflow_dispatch:
  push:
    tags: ["agent-room-v*"]
    branches: [main]
    paths: ["agent-room/desktop/**", ".github/workflows/agent-room-desktop.yml"]

permissions:
  contents: write

env:
  AGENT_ROOM_DEFAULT_HUB: https://homelab.tail35b6c6.ts.net

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles msi,nsis
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-room/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux build packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: agent-room/desktop/src-tauri

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          # Plain, predictable names so download links are easy to write.
          v=$(node -p "require('./package.json').version")
          out=../../dist-out; mkdir -p $out
          b=src-tauri/target
          put() { f=$(find $b -path '*/release/bundle/*' -type f -name "$1" | head -1); [ -n "$f" ] && cp "$f" "$out/$2"; true; }
          put '*-setup.exe'  "AgentRoom-$v-windows-setup.exe"
          put '*.msi'        "AgentRoom-$v-windows.msi"
          put '*.deb'        "AgentRoom-$v-linux-amd64.deb"
          put '*.rpm'        "AgentRoom-$v-linux-x86_64.rpm"
          put '*.AppImage'   "AgentRoom-$v-linux-x86_64.AppImage"
          put '*.dmg'        "AgentRoom-$v-macos.dmg"
          ls -l $out
          [ -n "$(ls $out)" ]

      - uses: actions/upload-artifact@v4
        with:
          name: agent-room-${{ matrix.name }}
          path: dist-out/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/agent-room-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never "latest": Marina's Mac app checks releases/latest for its own updates.
          tag="${GITHUB_REF_NAME}"; v="${tag#agent-room-v}"
          sed "s/{v}/$v/g" release-notes.md > ../../notes.md
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --latest=false --title "Agent Room $v" --notes-file ../../notes.md || true
          gh release upload "$tag" ../../dist-out/* --clobber
