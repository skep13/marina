name: Agent Room desktop app

# Builds the agent-room desktop app for Windows, macOS and Linux.
# Run it by hand (Actions → Agent Room desktop app → Run workflow), or push a
# tag like agent-room-v0.1.0 to also attach the installers to a draft release.
on:
  workflow_dispatch:
  push:
    tags: ["agent-room-v*"]
    branches: [main]
    paths: ["agent-room/desktop/**", ".github/workflows/agent-room-desktop.yml"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles msi,nsis
          - name: linux
            os: ubuntu-22.04
            args: --bundles deb,rpm,appimage
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-room/desktop
    steps:
      - uses: actions/checkout@v4

      - name: Linux build packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: agent-room/desktop/src-tauri

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p ../../dist-out
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' \) \
            -exec cp {} ../../dist-out/ \;
          ls -l ../../dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: agent-room-${{ matrix.name }}
          path: dist-out/*
          if-no-files-found: error

      - name: Attach to draft release
        if: startsWith(github.ref, 'refs/tags/agent-room-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Agent Room ${tag#agent-room-v}" --notes "Desktop app for the agent room."
          gh release upload "$tag" ../../dist-out/* --clobber
