<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' blob: data: http://127.0.0.1:8765">
  <title>Marina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="drag-strip" title="Drag to move"></div>

  <div id="chrome">
    <button id="btn-brain" class="chip" title="Choose model" aria-label="Choose model"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.6 4.4h7.2M2.6 8h5M2.6 11.6h7.2"/><circle cx="12.2" cy="4.4" r="1.5"/><circle cx="12.2" cy="11.6" r="1.5"/></svg></button>
    <button id="btn-reset"  class="chip" title="Forget conversation" aria-label="Forget conversation"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5.5A5.2 5.2 0 1 0 13.6 10"/><path d="M13.4 2.6v3h-3"/></svg></button>
    <button id="btn-model"  class="chip" title="Choose .vrm model" aria-label="Choose model"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="5" r="2.4"/><path d="M3.6 13.4c0-2.4 2-4 4.4-4s4.4 1.6 4.4 4"/></svg></button>
    <button id="btn-hide"   class="chip" title="Hide (⌘⇧H)" aria-label="Hide"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
    <button id="btn-quit"   class="chip" title="Quit" aria-label="Quit"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/></svg></button>
  </div>

  <div id="picker" class="hidden">
    <div class="pick-head">Choose a brain</div>
    <div id="pick-list"></div>
    <div class="pick-foot">History and memory stay on this Mac either way.</div>
  </div>

  <div id="bubble" class="hidden"><span id="bubble-text"></span></div>

  <canvas id="stage"></canvas>

  <div id="notice" class="hidden"></div>

  <div id="bar">
    <button id="btn-mic" title="Push to talk (⌘⇧Space)" aria-label="Push to talk"><svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6.1" y="2.2" width="3.8" height="7.2" rx="1.9"/><path d="M3.8 7.6a4.2 4.2 0 0 0 8.4 0"/><path d="M8 11.8v2"/></svg></button>
    <button id="btn-see" title="Look at my screen" aria-label="Look at my screen"><svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.4 8s2.6-4.2 6.6-4.2S14.6 8 14.6 8s-2.6 4.2-6.6 4.2S1.4 8 1.4 8z"/><circle cx="8" cy="8" r="2.1"/></svg></button>
    <input id="input" type="text" placeholder="Say something to Marina…" autocomplete="off">
    <button id="btn-send" title="Send" aria-label="Send"><svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.6 8h9.6"/><path d="M8.6 4.4L12.4 8l-3.8 3.6"/></svg></button>
  </div>

  <div id="status" role="button" tabindex="0" title="Change model"><span id="dot"></span><span id="status-text">connecting…</span></div>

  <script type="module" src="app.js"></script>
</body>
</html>
