<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Desktop</title>
  <style>
    :root {
      --glass-bg:     rgba(1, 5, 16, 0.86);
      --glass-border: rgba(22, 80, 200, 0.38);
      --glass-shadow: 0 8px 40px rgba(0, 20, 80, 0.5), inset 0 1px 0 rgba(255,255,255,0.04);
      --text:   rgba(200, 220, 255, 0.92);
      --dim:    rgba(110, 160, 230, 0.85);
      --mono:   'SF Mono', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #010508;
      overflow: hidden;
      font-family: var(--mono);
    }

    /* ── GUAC IFRAME ─────────────────────────────────────── */
    #guac-frame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none;
    }

    /* ── ATTACK MAP ROOT ─────────────────────────────────── */
    #attack-map {
      position: fixed; inset: 0;
      z-index: 5000;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
    }
    #attack-map.active {
      opacity: 1;
      pointer-events: all;
    }

    /* Full-screen canvas */
    /* TV readability: scale every overlay panel up together (keeps their
       layout intact) so labels can be read from across the room */
    #atk-header, #atk-metrics, #atk-feed, #atk-footer, #atk-top-types, #atk-leaderboard { zoom: 1.45; }
    #atk-canvas {
      position: absolute; inset: 0;
      z-index: 1;
      will-change: transform;
    }

    /* Edge vignette */
    #atk-vignette {
      position: absolute; inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse 80% 70% at 50% 55%,
        transparent 40%,
        rgba(1, 5, 16, 0.45) 70%,
        rgba(1, 5, 16, 0.85) 100%
      );
    }

    /* ── SHARED GLASS CARD ───────────────────────────────── */
    .glass {
      background: rgba(1, 5, 16, 0.95);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 10px;
    }

    /* ── HEADER BAR ──────────────────────────────────────── */
    #atk-header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 62px;
      z-index: 10;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 14px;
      background: rgba(1, 5, 16, 0.97);
      border-bottom: 1px solid var(--glass-border);
    }

    .atk-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .atk-logo-mark {
      width: 28px; height: 28px;
      border: 2px solid rgba(30,122,255,0.6);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
      color: #1e7aff;
    }
    .atk-logo-text {
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .atk-logo-text em {
      font-style: normal;
      color: #1e7aff;
    }

    .atk-header-title {
      position: absolute;
      left: 50%; transform: translateX(-50%);
      font-size: 0.65rem;
      color: var(--dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .atk-header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 22px;
    }

    /* Live pill */
    .atk-live-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 5px 11px;
      border: 1px solid rgba(255, 35, 35, 0.45);
      border-radius: 4px;
      background: rgba(255, 30, 30, 0.1);
    }
    .atk-live-pill .ldot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #ff2222;
      box-shadow: 0 0 8px #ff2222;
      animation: atk-blink 1.1s ease-in-out infinite;
    }
    .atk-live-pill span {
      font-size: 0.6rem;
      color: #ff5555;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    /* Header counter */
    .atk-header-counter {
      text-align: right;
    }
    #atk-cv {
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
      line-height: 1;
      text-shadow: 0 0 28px rgba(255, 50, 50, 0.5);
      font-variant-numeric: tabular-nums;
    }
    .atk-cv-meta {
      display: flex;
      justify-content: flex-end;
      align-items: baseline;
      gap: 10px;
      margin-top: 1px;
    }
    #atk-cl {
      font-size: 0.52rem;
      color: var(--dim);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    #atk-tps {
      font-size: 0.55rem;
      color: rgba(30, 200, 120, 0.65);
      letter-spacing: 0.08em;
    }

    /* ── METRICS CARD ────────────────────────────────────── */
    #atk-metrics {
      position: absolute;
      top: 82px; right: 20px;
      width: 196px;
      z-index: 10;
      padding: 16px 18px;
    }

    .atk-metric-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(22, 80, 200, 0.15);
    }
    .atk-metric-row:last-child { border-bottom: none; }

    .atk-metric-val {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      min-width: 2.5ch;
    }
    .atk-metric-val.sm { font-size: 1.1rem; }

    .atk-metric-info {
      flex: 1;
    }
    .atk-metric-label {
      font-size: 0.55rem;
      color: var(--dim);
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .atk-metric-sub {
      font-size: 0.6rem;
      color: rgba(200, 220, 255, 0.5);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── FEED PANEL ──────────────────────────────────────── */
    #atk-feed {
      position: absolute;
      bottom: 30px; left: 20px;
      width: 360px;
      z-index: 10;
      overflow: hidden;
    }

    #atk-feed-head {
      padding: 11px 16px 9px;
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #atk-feed-head .ftitle {
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
    }
    #atk-feed-head .fbadge {
      margin-left: auto;
      font-size: 0.55rem;
      color: rgba(30, 200, 120, 0.7);
      letter-spacing: 0.1em;
    }

    #atk-feed-list {
      padding: 8px 0 4px;
      display: flex;
      flex-direction: column;
    }

    .atk-entry {
      padding: 5px 16px;
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 8px;
      align-items: baseline;
      font-size: 0.68rem;
      animation: atk-slide 0.25s ease-out;
      transition: background 0.15s;
    }
    .atk-entry:hover { background: rgba(22, 80, 200, 0.1); }

    @keyframes atk-slide {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .atk-entry .e-ts {
      font-size: 0.58rem;
      color: var(--dim);
      white-space: nowrap;
    }
    .atk-entry .e-body {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(190, 215, 255, 0.7);
    }
    .atk-entry .e-src  { color: #ff5555; font-weight: 600; }
    .atk-entry .e-arr  { color: var(--dim); }
    .atk-entry .e-dst  { color: #22dd88; font-weight: 600; }
    .atk-entry .e-type { color: rgba(255, 190, 60, 0.8); }

    /* ── FOOTER ──────────────────────────────────────────── */
    #atk-footer {
      position: absolute;
      bottom: 10px; left: 0; right: 0;
      text-align: center;
      font-size: 0.52rem;
      color: rgba(70, 130, 210, 0.25);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      z-index: 10;
    }

    /* ── ANIMATIONS ──────────────────────────────────────── */
    @keyframes atk-blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.2; }
    }

    /* ── BLANKER ─────────────────────────────────────────── */
    #blanker {
      position: fixed; inset: 0;
      background: #010508;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #blanker.visible { opacity: 1; pointer-events: all; }

    #blanker-message {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 700;
      letter-spacing: 0.18em;
      color: #fff;
      text-transform: uppercase;
      font-family: var(--mono);
    }
    #blanker-sub {
      font-size: 1rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-family: var(--mono);
    }
    #blanker-bar-wrap {
      width: min(360px, 80vw);
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
    }
    #blanker-bar {
      height: 100%;
      width: 0%;
      background: #fff;
      border-radius: 99px;
      transition: width linear;
    }

    /* ── CONN DOT ────────────────────────────────────────── */
    #conn-dot {
      position: fixed;
      bottom: 14px; right: 16px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #555;
      z-index: 10000;
      transition: background 0.3s;
    }
    #conn-dot.ok  { background: #22c55e; }
    #conn-dot.err { background: #ef4444; }

    /* ── LEADERBOARD PANELS ──────────────────────────────────── */
    #atk-top-types {
      position: absolute;
      top: 82px; right: 230px;
      width: 224px;
      z-index: 10;
      overflow: hidden;
    }

    #atk-leaderboard {
      position: absolute;
      bottom: 30px; right: 20px;
      width: 210px;
      z-index: 10;
      overflow: hidden;
    }

    .panel-head {
      padding: 10px 14px 8px;
      font-size: 0.57rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .lb-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      font-size: 0.63rem;
    }
    .lb-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .lb-rank {
      width: 14px;
      font-size: 0.55rem;
      color: var(--dim);
      text-align: right;
      flex-shrink: 0;
    }
    .lb-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: rgba(190,215,255,0.8);
    }
    .lb-count {
      font-size: 0.68rem;
      font-weight: 700;
      color: #fff;
      font-variant-numeric: tabular-nums;
    }
    .lb-bar-wrap {
      width: 36px; height: 3px;
      background: rgba(22,80,200,0.2);
      border-radius: 99px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .lb-bar {
      height: 100%;
      border-radius: 99px;
      opacity: 0.72;
      transition: width 0.4s ease;
    }
    .lb-divider {
      height: 1px;
      background: var(--glass-border);
      margin: 3px 0;
    }
    .lb-flag {
      width: 20px; height: 15px;
      object-fit: cover;
      border-radius: 1px;
      flex-shrink: 0;
      opacity: 0.82;
      display: block;
    }

    /* shared CyberLab Vision logo header (matches game + detector) */
    #atk-header .logos { display: flex; align-items: center; gap: 14px; height: 100%; }
    #atk-header .logos img { height: 36px; width: auto; display: block; border-radius: 4px; }
    #atk-header .sep { width: 1px; height: 32px; background: var(--glass-border); margin: 0 8px; }
    #atk-header .brand { font-size: 1rem; font-weight: 700; color: #fff;
      letter-spacing: 0.14em; text-transform: uppercase; }
    #atk-header .brand em { font-style: normal; color: #1e7aff; }
  </style>
</head>

  // ── Maths ──────────────────────────────────────────────────
  function proj(lat, lon, w, h) {
    if (d3proj) { const [x,y] = d3proj([lon,lat]); return {x,y}; }
    return { x:(lon+180)/360*w, y:(90-lat)/180*h };
  }
  function bez(p0,cp,p2,t) {
    const m=1-t;
    return { x:m*m*p0.x+2*m*t*cp.x+t*t*p2.x, y:m*m*p0.y+2*m*t*cp.y+t*t*p2.y };
  }
  function ctrlPt(sp,dp) {
    const d=Math.hypot(dp.x-sp.x,dp.y-sp.y);
    return { x:(sp.x+dp.x)/2, y:(sp.y+dp.y)/2-Math.max(d*0.35,55) };
  }
  function pick(a) { return a[Math.floor(Math.random()*a.length)]; }
  function rgba(hex,a) {
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return `rgba(${r},${g},${b},${a.toFixed(3)})`;
  }
  // Pre-cached label widths (ctx must have FONT set before first use)
  const _labelWidthCache = {};

  function fmtNum(n) {
    n = Math.round(n);
    let s = '';
    while (n >= 1000) { s = ',' + String(n % 1000).padStart(3, '0') + s; n = Math.floor(n / 1000); }
    return n + s;
  }

  // ── Attack class ───────────────────────────────────────────
  class Attack {
    constructor() {
      this.src = pick(CITIES);
      do { this.dst = pick(CITIES); } while (this.dst===this.src);
      this.type  = pick(TYPES);
      this.color = TYPE_COLORS[this.type];
      this.progress = 0;
      this.speed = this.type === 'Unknown'
        ? 0.009 + Math.random()*0.009
        : 0.012 + Math.random()*0.018;
      this.fadeAlpha = 1;
      this.arrived = false;
      // Pre-parse RGB so rgba() avoids hex parsing in the hot path
      const hex = this.color;
      this._r = parseInt(hex.slice(1,3),16);
      this._g = parseInt(hex.slice(3,5),16);
      this._b = parseInt(hex.slice(5,7),16);
      // Cached projections — invalidated when canvas size changes
      this._projKey = '';
      this._sp = null; this._dp = null; this._cp = null;
      // Cached trail Path2D — rebuilt only when progress changes
      this._trail = null;
      this._trailT = -1;
      this._trailHead = null;
    }

    _rgba(a) {
      return `rgba(${this._r},${this._g},${this._b},${a.toFixed(3)})`;
    }

    _ensureProj(w, h) {
      const key = `${w}x${h}`;
      if (this._projKey === key) return;
      this._projKey = key;
      this._sp = proj(this.src.lat, this.src.lon, w, h);
      this._dp = proj(this.dst.lat, this.dst.lon, w, h);
      this._cp = ctrlPt(this._sp, this._dp);
      // Invalidate trail when projection changes
      this._trailT = -1; this._trail = null;
    }

    _buildTrail() {
      const endT = this.arrived ? 1 : this.progress;
      if (endT === this._trailT && this._trail) return;
      const {_sp: sp, _cp: cp, _dp: dp} = this;
      const STEPS = 28;
      const trail = new Path2D();
      const p0 = bez(sp, cp, dp, 0);
      trail.moveTo(p0.x, p0.y);
      let last = p0;
      for (let i = 1; i <= STEPS; i++) {
        last = bez(sp, cp, dp, (i / STEPS) * endT);
        trail.lineTo(last.x, last.y);
      }
      this._trail = trail;
      this._trailHead = last;
      this._trailT = endT;
    }

    update() {
      if (!this.arrived) {
        this.progress = Math.min(1, this.progress+this.speed);
        if (this.progress>=1) { this.arrived=true; onArrival(this); }
      } else {
        this.fadeAlpha = Math.max(0, this.fadeAlpha-0.016);
      }
    }
    dead() { return this.arrived && this.fadeAlpha<=0; }

    draw(ctx, w, h) {
      this._ensureProj(w, h);
      const endT = this.arrived ? 1 : this.progress;
      if (endT <= 0.01) return;
      this._buildTrail();

      const trail = this._trail;
      const hd = this._trailHead;
      const {_sp: sp, _dp: dp} = this;
      const fade = this.arrived ? this.fadeAlpha : 1;
      const isUnk = this.type === 'Unknown';

      ctx.lineJoin = 'round'; ctx.lineCap = 'round';

      // ── Layer 1: wide bloom ──
      ctx.strokeStyle = this._rgba((isUnk ? 0.20 : 0.16) * fade);
      ctx.lineWidth = isUnk ? 13 : 9;
      ctx.stroke(trail);

      // ── Layer 2: core trail (globalAlpha avoids per-frame gradient allocation) ──
      const prevAlpha = ctx.globalAlpha;
      ctx.globalAlpha = 0.85 * fade;
      ctx.strokeStyle = this._rgba(1);
      ctx.lineWidth = isUnk ? 3 : 2;
      ctx.stroke(trail);
      ctx.globalAlpha = prevAlpha;

      // ── Particle head ──
      if (!this.arrived) {
        const r1 = 16, r2 = 9, r3 = 4, r4 = 2;
        ctx.beginPath(); ctx.arc(hd.x, hd.y, r1, 0, Math.PI * 2);
        ctx.fillStyle = this._rgba(0.12); ctx.fill();
        ctx.beginPath(); ctx.arc(hd.x, hd.y, r2, 0, Math.PI * 2);
        ctx.fillStyle = this._rgba(0.30); ctx.fill();
        ctx.beginPath(); ctx.arc(hd.x, hd.y, r3, 0, Math.PI * 2);
        ctx.fillStyle = this._rgba(0.65); ctx.fill();
        ctx.beginPath(); ctx.arc(hd.x, hd.y, r4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff'; ctx.fill();

        // ── Floating label ──
        const labelAlpha = Math.min(1, this.progress * 6);
        if (labelAlpha > 0.05) {
          const labelText = isUnk ? '[ UNKNOWN ]' : this.type;
          const FONT = "bold 9px 'SF Mono','Fira Code',monospace";
          ctx.font = FONT;
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          let tw = _labelWidthCache[labelText];
          if (tw === undefined) tw = _labelWidthCache[labelText] = ctx.measureText(labelText).width;
          const lp = 6, r = 3;
          const bh = 14;
          const bx = hd.x - tw/2 - lp;
          const by = hd.y - 30;
          const bw = tw + lp*2;
          ctx.beginPath();
          ctx.moveTo(bx+r,by); ctx.lineTo(bx+bw-r,by);
          ctx.quadraticCurveTo(bx+bw,by,bx+bw,by+r);
          ctx.lineTo(bx+bw,by+bh-r);
          ctx.quadraticCurveTo(bx+bw,by+bh,bx+bw-r,by+bh);
          ctx.lineTo(bx+r,by+bh);
          ctx.quadraticCurveTo(bx,by+bh,bx,by+bh-r);
          ctx.lineTo(bx,by+r);
          ctx.quadraticCurveTo(bx,by,bx+r,by);
          ctx.closePath();
          ctx.fillStyle = `rgba(1,5,16,${(0.88*labelAlpha).toFixed(2)})`; ctx.fill();
          ctx.strokeStyle = this._rgba(0.45 * labelAlpha);
          ctx.lineWidth = 0.8; ctx.stroke();
          ctx.fillStyle = this._rgba(0.95 * labelAlpha);
          ctx.fillText(labelText, hd.x, by + bh/2);
        }
      }

      // ── Impact rings ──
      if (this.arrived && fade > 0) {
        const rings = isUnk ? 3 : 2;
        for (let ring = 0; ring < rings; ring++) {
          const rf = Math.max(0, fade - ring * 0.28);
          if (rf <= 0) continue;
          ctx.beginPath();
          ctx.arc(dp.x, dp.y, (1-rf) * (18+ring*8) + 4, 0, Math.PI*2);
          ctx.strokeStyle = this._rgba(rf * 0.65);
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      }
    }
  }

  // ── City pixels cache (reproject only when d3proj or canvas size changes) ──
  let cityCache = null, cityCacheKey = '';
  function getCityPx(w, h) {
    const key = `${w}x${h}x${d3proj ? '1' : '0'}`;
    if (key === cityCacheKey) return cityCache;
    cityCache = CITIES.map(c => ({ city: c, px: proj(c.lat, c.lon, w, h) }));
    cityCacheKey = key;
    return cityCache;
  }

  // ── City dots (no shadowBlur) ──────────────────────────────
  function drawCities(ctx, w, h, ts, srcs, dsts) {
    const cities = getCityPx(w, h);
    for (const { city, px } of cities) {
      const pulse = 0.5 + 0.5 * Math.sin(ts * 0.0013 + (city.lat + city.lon) * 0.07);
      const isSrc = srcs.has(city.n);
      const isDst = dsts.has(city.n);

      if (isSrc || isDst) {
        // Highlight: two concentric fills instead of shadowBlur
        const hColor = isSrc ? '#ff8800' : '#ff2222';
        ctx.beginPath(); ctx.arc(px.x, px.y, 7 + pulse * 2, 0, Math.PI * 2);
        ctx.fillStyle = rgba(hColor, 0.15 + 0.06 * pulse); ctx.fill();
        ctx.beginPath(); ctx.arc(px.x, px.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = rgba(hColor, 0.4); ctx.fill();
      }

      // Outer aura
      ctx.beginPath(); ctx.arc(px.x, px.y, 3 + pulse * 1.6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,200,100,${(0.07 + 0.05 * pulse).toFixed(2)})`; ctx.fill();

      // Inner dot (no shadowBlur)
      ctx.beginPath(); ctx.arc(px.x, px.y, isSrc || isDst ? 2.2 : 1.7, 0, Math.PI * 2);
      ctx.fillStyle = isSrc ? '#ff9900' : isDst ? '#ff3333' : '#00e87a';
      ctx.fill();
    }
  }

  // ── Country glow on impact ────────────────────────────────
  function triggerCountryGlow(city, color, duration) {
    if (!worldCountries || !d3pathGen) return;
    const feature = worldCountries.features.find(f =>
      d3.geoContains(f, [city.lon, city.lat])
    );
    if (!feature) return;
    // Pre-build Path2D and pre-parse RGB once, not every frame
    const hex = color;
    const cr = parseInt(hex.slice(1,3),16);
    const cg = parseInt(hex.slice(3,5),16);
    const cb = parseInt(hex.slice(5,7),16);
    countryGlows.push({
      path2d: new Path2D(d3pathGen(feature)),
      cr, cg, cb,
      born: performance.now(),
      dur: duration || 2200,
    });
  }

  function drawCountryGlows(ctx) {
    if (!countryGlows.length) return;
    const now = performance.now();
    countryGlows = countryGlows.filter(g => now - g.born < g.dur);
    for (const g of countryGlows) {
      const t = (now - g.born) / g.dur;
      const alpha = Math.sin(t * Math.PI) * 0.38;
      if (alpha <= 0) continue;
      const {path2d, cr, cg, cb} = g;
      ctx.save();
      ctx.fillStyle   = `rgba(${cr},${cg},${cb},${(alpha*0.55).toFixed(3)})`;
      ctx.fill(path2d);
      ctx.strokeStyle = `rgba(${cr},${cg},${cb},${(alpha*0.9).toFixed(3)})`;
      ctx.lineWidth = 1.2;
      ctx.stroke(path2d);
      ctx.restore();
    }
  }

  // ── Background particles (precomputed color strings, no shadowBlur) ──
  function initParticles(w, h) {
    particles = Array.from({length: 25}, () => {
      const a = Math.random() * 0.2 + 0.04;
      return {
        x: Math.random() * w, y: Math.random() * h,
        r: Math.random() * 0.8 + 0.2,
        vx: (Math.random() - 0.5) * 0.18,
        vy: -Math.random() * 0.2 - 0.04,
        color: `rgba(30,100,255,${a.toFixed(2)})`,
      };
    });
  }
  function drawParticles(ctx, w, h) {
    for (const p of particles) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -2) { p.y = h + 2; p.x = Math.random() * w; }
      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
    }
  }

  // ── World map loading ──────────────────────────────────────
  function loadScript(src) {
    return new Promise((ok,fail)=>{
      if(document.querySelector(`script[src="${src}"]`)){ok();return;}
      const s=document.createElement('script');
      s.src=src; s.onload=ok; s.onerror=fail;
      document.head.appendChild(s);
    });
  }

  function drawGridFallback(mctx, w, h) {
    mctx.strokeStyle='rgba(4,20,60,0.6)'; mctx.lineWidth=0.5;
    for(let lat=-90;lat<=90;lat+=15){
      const y=(90-lat)/180*h;
      mctx.beginPath();mctx.moveTo(0,y);mctx.lineTo(w,y);mctx.stroke();
    }
    for(let lon=-180;lon<=180;lon+=15){
      const x=(lon+180)/360*w;
      mctx.beginPath();mctx.moveTo(x,0);mctx.lineTo(x,h);mctx.stroke();
    }
    // Equator + prime meridian brighter
    mctx.strokeStyle='rgba(10,50,140,0.7)'; mctx.lineWidth=0.8;
    mctx.setLineDash([4,4]);
    const eq=h/2, pm=(0+180)/360*w;
    mctx.beginPath();mctx.moveTo(0,eq);mctx.lineTo(w,eq);mctx.stroke();
    mctx.beginPath();mctx.moveTo(pm,0);mctx.lineTo(pm,h);mctx.stroke();
    mctx.setLineDash([]);
  }

  async function buildMap(canvas) {
    const w=canvas.width, h=canvas.height;
    const off=document.createElement('canvas');
    off.width=w; off.height=h;
    const mctx=off.getContext('2d');

    mctx.fillStyle='#010508';
    mctx.fillRect(0,0,w,h);

    try {
      await Promise.all([
        loadScript('/static/d3.min.js'),
        loadScript('/static/topojson-client.min.js'),
      ]);
      const world = await fetch('/static/countries-110m.json').then(r=>r.json());

      // Fit the sphere to fill available canvas, then use this projection for city coords too
      const p = d3.geoEquirectangular()
        .scale(w/(2*Math.PI))
        .translate([w/2,h/2]);

      const path = d3.geoPath().projection(p).context(mctx);

      // Graticule (15° grid)
      mctx.beginPath();
      path(d3.geoGraticule().step([15,15])());
      mctx.strokeStyle='rgba(4,20,60,0.55)';
      mctx.lineWidth=0.4;
      mctx.stroke();

      // Land fill
      const countries = topojson.feature(world,world.objects.countries);
      worldCountries = countries;
      d3pathGen = d3.geoPath().projection(p);
      mctx.beginPath(); path(countries);
      mctx.fillStyle='rgba(10,34,80,0.96)';
      mctx.fill();

      // Coastlines with glow
      mctx.shadowColor='rgba(22,80,200,0.4)';
      mctx.shadowBlur=5;
      mctx.beginPath();
      path(topojson.mesh(world,world.objects.countries,(a,b)=>a===b));
      mctx.strokeStyle='rgba(50,120,235,0.9)';
      mctx.lineWidth=0.8;
      mctx.stroke();
      mctx.shadowBlur=0;

      // Internal borders
      mctx.beginPath();
      path(topojson.mesh(world,world.objects.countries,(a,b)=>a!==b));
      mctx.strokeStyle='rgba(18,60,145,0.4)';
      mctx.lineWidth=0.4;
      mctx.stroke();

      d3proj = p;
    } catch(err) {
      console.log('[ATK] CDN unavailable, grid fallback:', err.message);
      drawGridFallback(mctx,w,h);
      d3proj = null;
    }

    mapCanvas = off;
  }

  // ── UI updates ─────────────────────────────────────────────
  function onArrival(atk) {
    total++;
    tpsAccum++;
    typeCount[atk.type] = (typeCount[atk.type]||0)+1;
    srcCount[atk.src.c]  = (srcCount[atk.src.c]  ||0)+1;
    dstCount[atk.dst.c]  = (dstCount[atk.dst.c]  ||0)+1;
    triggerCountryGlow(atk.dst, atk.color, atk.type === 'Unknown' ? 3200 : 2200);
    addFeedEntry(atk);
  }

  function addFeedEntry(atk) {
    const list = _elFeedList;
    if(!list) return;
    const ts = new Date().toTimeString().slice(0,8);
    const div = document.createElement('div');
    div.className='atk-entry';
    div.innerHTML =
      `<span class="e-ts">${ts}</span>` +
      `<span class="e-body">` +
        `<span class="e-src">${atk.src.n}</span>` +
        `<span class="e-arr"> ▸ </span>` +
        `<span class="e-dst">${atk.dst.n}</span>` +
        ` — <span class="e-type" style="color:${atk.color}">${atk.type}</span>` +
      `</span>`;
    list.insertBefore(div,list.firstChild);
    while(list.children.length>10) list.removeChild(list.lastChild);
  }

  function updateMetrics(ts) {
    if(ts-metricsLastUpdate < 500) return;
    metricsLastUpdate=ts;

    const live   = attacks.filter(a=>!a.arrived);
    const dstSet = new Set(live.map(a=>a.dst.c));
    const topT   = Object.entries(typeCount).sort((a,b)=>b[1]-a[1])[0];

    if(_elActive)  _elActive.textContent  = live.length;
    if(_elCountry) _elCountry.textContent = dstSet.size;
    if(_elTopType) _elTopType.textContent = topT ? topT[0] : '—';

    // ── Top attack types ──
    const topTypes = Object.entries(typeCount).sort((a,b)=>b[1]-a[1]).slice(0,7);
    const maxTn = topTypes[0]?.[1] || 1;
    if(_elTypeList && topTypes.length) {
      _elTypeList.innerHTML = topTypes.map(([type,n]) => {
        const col = TYPE_COLORS[type] || '#888';
        const pct = Math.round(n/maxTn*100);
        return `<div class="lb-row">` +
          `<span class="lb-dot" style="background:${col}"></span>` +
          `<span class="lb-name">${type}</span>` +
          `<span class="lb-count">${n}</span>` +
          `<div class="lb-bar-wrap"><div class="lb-bar" style="width:${pct}%;background:${col}"></div></div>` +
          `</div>`;
      }).join('');
    }

    // ── Top attackers ──
    const topSrc = Object.entries(srcCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
    if(_elOrigList && topSrc.length) {
      _elOrigList.innerHTML = topSrc.map(([c,n],i) => {
        const code = COUNTRY_FLAGS[c];
        const flag = code ? `<img class="lb-flag" src="/static/flags/${code}.png" alt="${c}">` : '';
        return `<div class="lb-row"><span class="lb-rank">${i+1}</span>${flag}<span class="lb-name">${c}</span><span class="lb-count">${n}</span></div>`;
      }).join('');
    }

    // ── Top targeted ──
    const topDst = Object.entries(dstCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
    if(_elTargList && topDst.length) {
      _elTargList.innerHTML = topDst.map(([c,n],i) => {
        const code = COUNTRY_FLAGS[c];
        const flag = code ? `<img class="lb-flag" src="/static/flags/${code}.png" alt="${c}">` : '';
        return `<div class="lb-row"><span class="lb-rank">${i+1}</span>${flag}<span class="lb-name">${c}</span><span class="lb-count">${n}</span></div>`;
      }).join('');
    }
  }

  // ── Animation frame (capped at 30 fps) ────────────────────
  function frame(ts) {
    if(!active) return;
    if(ts - _lastFrameTs < 33) { animFrame=requestAnimationFrame(frame); return; }
    _lastFrameTs = ts;

    const canvas = _canvas;
    const ctx = _ctx;
    const w=canvas.width, h=canvas.height;

    // Clear & draw background
    ctx.clearRect(0,0,w,h);
    if(mapCanvas) {
      ctx.drawImage(mapCanvas,0,0,w,h);
    } else {
      ctx.fillStyle='#010508';
      ctx.fillRect(0,0,w,h);
    }

    // Country glows (drawn before particles/cities so they sit under everything)
    drawCountryGlows(ctx);

    // Background particles
    drawParticles(ctx,w,h);

    // City sets for highlighting — single pass, no throwaway arrays
    const srcs = new Set(), dsts = new Set();
    for(const a of attacks){ if(!a.arrived){ srcs.add(a.src.n); dsts.add(a.dst.n); } }
    drawCities(ctx,w,h,ts,srcs,dsts);

    // Attacks
    attacks = attacks.filter(a=>!a.dead());
    for(const a of attacks){ a.update(); a.draw(ctx,w,h); }

    // Spawn
    if(attacks.length<14 && Math.random()<0.09) attacks.push(new Attack());

    // Background counter drift
    if(Math.random()<0.45) { total+=Math.floor(Math.random()*4)+1; }
    // Smooth counter lerp
    displayTotal += (total-displayTotal)*0.08;
    if(_elCv) _elCv.textContent=fmtNum(displayTotal);

    // TPS
    if(ts-tpsLastTick>=1000){
      tps=tpsAccum; tpsAccum=0; tpsLastTick=ts;
      if(_elTps) _elTps.textContent=tps+' /sec';
    }

    updateMetrics(ts);
    animFrame=requestAnimationFrame(frame);
  }

  // ── Public API ─────────────────────────────────────────────
  window.atkStart = function() {
    if(active) return;
    active=true; attacks=[];
    typeCount={}; srcCount={}; dstCount={}; countryGlows=[];

    document.getElementById('attack-map').classList.add('active');

    _cacheDom();
    _canvas.width=window.innerWidth;
    _canvas.height=window.innerHeight;

    initParticles(_canvas.width,_canvas.height);
    total = BASE_COUNT+Math.floor(Math.random()*200000);
    displayTotal = total;

    if(_elCv) _elCv.textContent=fmtNum(total);
    if(_elFeedList) _elFeedList.innerHTML='';

    if(!mapCanvas) buildMap(_canvas);

    tpsLastTick=performance.now(); tpsAccum=0;
    animFrame=requestAnimationFrame(frame);
  };

  window.atkStop = function() {
    active=false;
    if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
    attacks=[];
    document.getElementById('attack-map').classList.remove('active');
  };

  window.addEventListener('resize',()=>{
    if(!active) return;
    _canvas.width=window.innerWidth;
    _canvas.height=window.innerHeight;
    // ctx reference stays valid after resize — no need to re-query
    initParticles(_canvas.width,_canvas.height);
    mapCanvas=null; d3proj=null; worldCountries=null; d3pathGen=null;
    cityCache=null; cityCacheKey=''; countryGlows=[];
    buildMap(_canvas);
  });

})();
// standalone kiosk attack-map: auto-run, no blanker, no SSE
function _startMap(){ try { window.atkStart(); } catch(e){ setTimeout(_startMap, 500); } }
if (document.readyState === 'complete') _startMap();
else window.addEventListener('load', _startMap);
</script>
</body></html>
