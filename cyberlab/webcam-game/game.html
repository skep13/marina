<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zone Grab</title>
<style>
/* matches the open-evening demo (attack map / control panel): navy glass, mono, #1e7aff */
:root{--bg:#010508;--glass:rgba(1,5,16,.95);--glass-border:rgba(22,80,200,.22);
  --glass-shadow:0 8px 40px rgba(0,20,80,.5),inset 0 1px 0 rgba(255,255,255,.04);
  --ac:#1e7aff;--gold:#ffd60a;--duo:#bf5af2;--clock:#64d2ff;--bad:#ff3b30;
  --tx:rgba(200,220,255,.92);--mut:rgba(70,130,210,.6);
  --mono:'SF Mono','Fira Code','JetBrains Mono','Cascadia Code','Consolas',monospace}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--tx);overflow:hidden;font-family:var(--mono);cursor:none}
#cam{position:fixed;inset:0;width:100%;height:100%;transform:scaleX(-1);
  filter:saturate(.6) brightness(.62) contrast(1.05)}
#fx{position:fixed;inset:0;width:100%;height:100%}
#vignette{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 80% 70% at 50% 55%,transparent 40%,rgba(1,5,16,.45) 70%,rgba(1,5,16,.85) 100%)}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0}
.glass{background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);border-radius:10px}
.hud{position:fixed;left:0;right:0;top:0;height:9vh;display:flex;align-items:center;gap:1.4vw;padding:0 2vw;
  background:rgba(1,5,16,.97);border-bottom:1px solid var(--glass-border);pointer-events:none;z-index:5}
.logos{display:flex;align-items:center;gap:1.1vw;height:100%}
.logos img{height:5.8vh;width:auto;display:block;border-radius:.5vh}
.sep{width:1px;height:4.6vh;background:var(--glass-border);margin:0 .4vw}
.brand{font-size:2.6vh;font-weight:700;color:#fff;letter-spacing:.14em;text-transform:uppercase}
.brand em{font-style:normal;color:var(--ac)}
.stats{margin-left:auto;display:flex;align-items:center;gap:2.6vw}
.stat{text-align:right;min-width:6vw}
.stat b{display:block;font-size:4.2vh;line-height:1;color:#fff;font-variant-numeric:tabular-nums;font-weight:700;transition:color .2s}
.stat span{font-size:1.6vh;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
#combo{color:var(--gold)}
.live{display:flex;align-items:center;gap:.6vw;padding:.7vh .9vw;border:1px solid rgba(255,35,35,.45);
  border-radius:4px;background:rgba(255,30,30,.1)}
.live i{width:1vh;height:1vh;border-radius:50%;background:#ff2222;box-shadow:0 0 8px #ff2222;animation:blink 1.1s ease-in-out infinite}
.live span{font-size:1.6vh;color:#ff5555;letter-spacing:.18em;text-transform:uppercase}
@keyframes blink{50%{opacity:.25}}
.bump{animation:bump .25s}
@keyframes bump{50%{transform:scale(1.2)}}
#time.urgent{color:var(--bad);animation:pulse .5s infinite alternate}
#time.plus{color:var(--clock)}
@keyframes pulse{to{transform:scale(1.1);text-shadow:0 0 24px var(--bad)}}
.timebar{position:fixed;left:0;top:9vh;height:.4vh;background:var(--ac);box-shadow:0 0 12px var(--ac);transition:width .2s linear;z-index:6}
.timebar.urgent{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.banner{position:fixed;left:50%;top:10.5vh;transform:translateX(-50%);text-align:center;pointer-events:none;
  padding:1.4vh 2vw;width:max-content;max-width:62vw;transition:opacity .3s}
.banner h2{font-size:3.8vh;color:#fff;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.banner .title{font-size:2vh;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:.6vh}
.banner p{margin-top:.9vh;font-size:2.2vh;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:.6vh 1.4vw;justify-content:center;margin-top:1.4vh;font-size:1.85vh;
  color:var(--tx);letter-spacing:.08em;text-transform:uppercase}
.legend i{display:inline-block;width:1.7vh;height:1.7vh;border-radius:50%;margin-right:.5vw;vertical-align:-.25vh;border:2px solid}
.tip{margin-top:1.2vh;font-size:2vh;color:var(--ac);letter-spacing:.1em;text-transform:uppercase;transition:opacity .4s}
.tip::before{content:"› "}
.stats-row{display:flex;gap:2vw;justify-content:center;margin-top:1.2vh}
.stats-row div{text-align:center}
.stats-row b{display:block;font-size:2.4vh;color:#fff;font-variant-numeric:tabular-nums}
.stats-row span{font-size:1.6vh;letter-spacing:.2em;color:var(--mut);text-transform:uppercase}
.board{position:fixed;right:1.6vw;bottom:2.4vh;width:14vw;min-width:200px;pointer-events:none;padding:1.4vh 1.1vw;transition:opacity .3s}
.board h3{font-size:1.7vh;letter-spacing:.24em;color:var(--mut);text-transform:uppercase;margin-bottom:1vh;font-weight:400}
.board ol{list-style:none;counter-reset:r}
.board li{counter-increment:r;display:flex;align-items:baseline;gap:.8vw;font-size:2.7vh;font-weight:700;color:#fff;
  font-variant-numeric:tabular-nums;padding:.45vh 0;border-top:1px solid var(--glass-border)}
.board li::before{content:counter(r,decimal-leading-zero);font-size:1.7vh;color:var(--mut);width:1.8vw;font-weight:400}
.board li:first-child{color:var(--gold)}
.board li.you{color:var(--ac)}
.board li.you::after{content:"you";margin-left:auto;font-size:1.7vh;letter-spacing:.2em;text-transform:uppercase}
.board .meta{margin-top:.8vh;font-size:1.5vh;color:var(--mut);letter-spacing:.14em;text-transform:uppercase}
.big{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  font-size:18vh;font-weight:700;color:#fff;text-shadow:0 0 6vh rgba(30,122,255,.8)}
.toast{position:fixed;left:50%;top:22vh;transform:translateX(-50%);pointer-events:none;font-size:3.2vh;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;opacity:0;white-space:nowrap}
.toast.show{animation:toast 1.4s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,2vh) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.05)}
  75%{opacity:1}100%{opacity:0;transform:translate(-50%,-2vh)}}
.hidden{opacity:0!important}
.gone{display:none!important}
#err{position:fixed;left:2vw;bottom:2vh;font-size:1.9vh;color:var(--bad);letter-spacing:.16em;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="cam"></canvas>
<canvas id="fx"></canvas>
<div id="flash"></div>
<div class="timebar gone" id="timebar"></div>
<div id="vignette"></div>
<div class="hud">
  <div class="logos">
    <img src="/logos/hackclub.svg" alt="Hack Club">
    <img src="/logos/coleg-gwent.svg" alt="Coleg Gwent">
    <img src="/logos/cybercollege-cymru.png" alt="Cyber College Cymru">
  </div>
  <div class="sep"></div>
  <div class="brand">Zone <em>Grab</em></div>
  <div class="stats">
    <div class="stat"><b id="score">0</b><span>score</span></div>
    <div class="stat"><b id="combo">x1</b><span>combo</span></div>
    <div class="stat"><b id="time">60</b><span>seconds</span></div>
    <div class="live"><i></i><span>Live</span></div>
  </div>
</div>
<div class="banner glass" id="banner">
  <div class="title gone" id="btag"></div>
  <h2 id="btitle"></h2><p id="bsub"></p>
  <div class="stats-row gone" id="endstats"></div>
  <div class="legend" id="legend">
    <span><i style="border-color:var(--ac)"></i>touch with the body part shown</span>
    <span><i style="border-color:var(--gold)"></i>x2 points</span>
    <span><i style="border-color:var(--duo)"></i>two people's hands · x3</span>
    <span><i style="border-color:var(--clock)"></i>+5 seconds</span>
    <span><i style="border-color:var(--bad);border-style:dashed"></i>don't touch!</span>
  </div>
  <div class="tip" id="tip"></div>
</div>
<div class="board glass" id="board"><h3>Today's top 5</h3><ol id="top"></ol><div class="meta" id="meta"></div></div>
<div class="big gone" id="big"></div>
<div class="toast" id="toast"></div>
<div id="err"></div>

<script>
"use strict";
// ---- tunables -------------------------------------------------------------
const GAME_SECONDS = 60;
const PERSON_CONF = 0.40;    // ignore weaker person detections (posters/monitors score ~0.3)
const KP_CONF = 0.35;        // ignore weaker keypoints
// legs behind desks get "invented" by the model at ~0.6: demand more for knees/ankles
const LEG_CONF = 0.65;
const KP_MIN = i => (i >= 13 ? LEG_CONF : KP_CONF);
const HOLD_MS = {hand: 300, head: 350, foot: 350, duo: 500, start: 700};
const HAZARD_TOUCH_MS = 180;
const ZONE_LIFE_MS = 6000;
const HEAD_FROM_S = 8;       // head zones (lean/duck) mixed in after this
const HAZARD_FROM_S = 20;    // red zones appear after this many seconds
const DUO_FROM_S = 10;       // two-person zones, only when 2+ players are in view
const MOVING_FROM_S = 40;    // zones drift after this many seconds
const CLOCK_BONUS_S = 5;
// circle radius per zone type, as [share of the player's shoulder width, min, max]
// in screen heights: tracks the player's size but stays touchable and never huge
const SIZE = {hand: [.32, .05, .08], head: [.38, .055, .085], foot: [.38, .05, .08],
              hazard: [.45, .06, .095], duo: [.55, .08, .12], start: [.42, .075, .1]};
const radius = (part, s) => clamp(s * SIZE[part][0], SIZE[part][1], SIZE[part][2]);
const MAX_CLOCKS = 2;
// scoring: a grab is BASE + up to SPEED for a fast one, x GOLD/DUO for special
// zones, x the combo multiplier (+COMBO_STEP per chained grab, capped).
// One grab is worth 50-600, so a strong 60 s round lands around 4-8k.
const BASE_POINTS = 50;
const SPEED_POINTS = 50;
const GOLD_MULT = 2;
const DUO_MULT = 3;
const COMBO_STEP = 0.25;
const COMBO_MAX = 5;         // combo level 5 = x2
const COMBO_WINDOW_MS = 3000;
const HAZARD_PENALTY = 100;
const POLL_MS = 40;
const MONO = "'SF Mono','Fira Code','JetBrains Mono','Cascadia Code',Consolas,monospace";
const TEST_MODE = new URLSearchParams(location.search).has("test");
const TITLES = [[0, "Warming up"], [800, "Zone Rookie"], [2000, "Zone Runner"], [3500, "Zone Pro"],
                [5000, "Zone Master"], [7000, "Zone Legend"]];
const TIPS = ["Touch each circle with the body part it shows",
              "HEAD circles: lean or duck so your head goes in",
              "Purple circles need hands from two different people",
              "Chain touches within 3 seconds to build a combo up to x2",
              "Mint circles add 5 seconds to the clock",
              "Red dashed circles cost points if any part of you touches them"];

// COCO keypoints
const K = {nose: 0, lsh: 5, rsh: 6, lel: 7, rel: 8, lwr: 9, rwr: 10, lhip: 11, rhip: 12, lkn: 13, rkn: 14, lan: 15, ran: 16};
const BONES = [[5, 6], [5, 7], [7, 9], [6, 8], [8, 10], [5, 11], [6, 12], [11, 12], [11, 13], [13, 15], [12, 14], [14, 16]];

const $ = id => document.getElementById(id);
// ---- self-healing MJPEG reader ---------------------------------------------
// Reads the multipart stream with fetch and paints the newest JPEG onto a
// canvas. If no frame arrives for 3 s (camera unplugged, server restart,
// network blip) the connection is dropped and reopened until frames flow again.
function mjpegCanvas(url, canvas, onFrame) {
  const ctx = canvas.getContext("2d");
  const st = {lastFrame: performance.now(), w: 0, h: 0};
  const find = (b, x, y, from) => { for (let i = from; i < b.length - 1; i++) if (b[i] === x && b[i + 1] === y) return i; return -1; };
  (async function loop() {
    for (;;) {
      const ctrl = new AbortController();
      const wd = setInterval(() => { if (performance.now() - st.lastFrame > 3000) ctrl.abort(); }, 1000);
      try {
        const rd = (await fetch(url + "?" + Date.now(), {cache: "no-store", signal: ctrl.signal})).body.getReader();
        let buf = new Uint8Array(0), busy = false;
        for (;;) {
          const {value, done} = await rd.read();
          if (done) break;
          const nb = new Uint8Array(buf.length + value.length); nb.set(buf); nb.set(value, buf.length); buf = nb;
          let jpg = null;
          for (;;) {
            const a = find(buf, 0xFF, 0xD8, 0); if (a < 0) { buf = new Uint8Array(0); break; }
            const b = find(buf, 0xFF, 0xD9, a + 2); if (b < 0) { buf = buf.slice(a); break; }
            jpg = buf.slice(a, b + 2); buf = buf.slice(b + 2);
          }
          if (buf.length > 4e6) buf = new Uint8Array(0);
          if (jpg && !busy) {                       // decode only the newest frame
            busy = true;
            createImageBitmap(new Blob([jpg], {type: "image/jpeg"})).then(bm => {
              const W = innerWidth, H = innerHeight;
              if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
              const ar = bm.width / bm.height, w = Math.max(W, H * ar), h = w / ar;   // cover
              ctx.drawImage(bm, (W - w) / 2, (H - h) / 2, w, h);
              st.w = bm.width; st.h = bm.height; st.lastFrame = performance.now();
              bm.close(); if (onFrame) onFrame(st);
            }).catch(() => {}).finally(() => { busy = false; });
          }
        }
      } catch (e) {}
      clearInterval(wd);
      await new Promise(r => setTimeout(r, 1000));
      st.lastFrame = performance.now();             // give the new connection a full 3 s
    }
  })();
  return st;
}

const cv = $("fx"), cx = cv.getContext("2d");
const video = mjpegCanvas("/raw.mjpg", $("cam"));
let AR = 16 / 9;             // video aspect: x distances are scaled by this so circles stay round

// people: tracked {id, b:[x,y,w,h], k:[[x,y,c]*17] (raw), sk: smoothed kps}
let raw = [], people = [], nextId = 1;
let lastDet = 0, lastDetLocal = performance.now();
let state = "attract";
let zones = [], parts = [], floaters = [];
let score = 0, combo = 1, endAt = 0, startedAt = 0, nextSpawn = 0, nextHazard = 0, nextSpecial = 0, startZone = null;
let overUntil = 0, lastHitAt = 0, lastTick = 0, myScore = null, tipIdx = 0;
let stats = null, board = {top: [], today: 0, games_today: 0, best: 0};
const bootAt = performance.now();
const comboMult = () => 1 + COMBO_STEP * (combo - 1);
const titleFor = s => TITLES.filter(t => s >= t[0]).pop()[1];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---- detections & tracking ------------------------------------------------
async function poll() {
  try {
    const j = await (await fetch("/detections.json", {cache: "no-store"})).json();
    if (j.t && j.t !== lastDet) {
      lastDet = j.t; lastDetLocal = performance.now();
      raw = j.d.filter(d => d.c === "person" && d.p >= PERSON_CONF).map(d => {
        const [bx, by, bw, bh] = d.b, mx = bw * .15, my = bh * .06;
        return {b: [1 - bx - bw, by, bw, bh],          // mirrored
                // drop low-confidence points and any point outside the person's
                // own box (a sure sign the model is guessing)
                k: (d.k || []).map((k, i) => {
                  const inBox = k[0] >= bx - mx && k[0] <= bx + bw + mx && k[1] >= by - my && k[1] <= by + bh + my;
                  return [1 - k[0], k[1], inBox && k[2] >= KP_MIN(i) ? k[2] : 0];
                })};
      });
      track();
    }
    const now = performance.now();
    $("err").textContent = now - video.lastFrame > 3000 || now - lastDetLocal > 3000 ? "camera feed stalled · reconnecting" : "";
  } catch (e) { $("err").textContent = "detector offline"; }
  setTimeout(poll, POLL_MS);
}
// HITBOX MODE: each player is their person box from the detector. Boxes are
// far more reliable than individual joints, so hits are judged on the box.
// The box is smoothed with a One Euro filter: steady when still, quick when moving.
const EURO = {minCutoff: 1.2, beta: 1.6, dCutoff: 1.0};
const alphaFor = (cutoff, dt) => 1 / (1 + 1 / (2 * Math.PI * cutoff * dt));
function euro(f, x, y, dt) {
  const dx = (x - f.x) / dt, dy = (y - f.y) / dt;
  const ad = alphaFor(EURO.dCutoff, dt);
  f.dx += ad * (dx - f.dx); f.dy += ad * (dy - f.dy);
  const a = alphaFor(EURO.minCutoff + EURO.beta * Math.hypot(f.dx, f.dy), dt);
  f.x += a * (x - f.x); f.y += a * (y - f.y);
}
function filterBox(p, b, now) {
  const dt = Math.max(.016, Math.min(.25, (now - (p.lastUpd || now - 50)) / 1000));
  p.lastUpd = now;
  const c = [[b[0], b[1]], [b[0] + b[2], b[1] + b[3]]];
  if (!p.fb) p.fb = c.map(([x, y]) => ({x, y, dx: 0, dy: 0}));
  else c.forEach(([x, y], i) => euro(p.fb[i], x, y, dt));
  const [a, z] = p.fb;
  p.b = [a.x, a.y, Math.max(.01, z.x - a.x), Math.max(.01, z.y - a.y)];
  if (b[1] + b[3] < .96) p.feetSeen = now;        // bottom of the body is in shot
}
// joints: same filter per joint, plus a short hold-over when one drops out
const HOLD_JOINT_MS = 220;
const HEAD_MAX_Y = 0.72;      // a "head" this low on screen is a misdetection
function headSane(k) {
  if (k.length < 17) return;
  const sh = [k[K.lsh], k[K.rsh]].filter(q => q[2] > 0);
  const shY = sh.length ? sh.reduce((a, q) => a + q[1], 0) / sh.length : 1;
  for (let i = 0; i <= 4; i++) if (k[i][2] > 0 && (k[i][1] > shY - .01 || k[i][1] > HEAD_MAX_Y)) k[i][2] = 0;
}
function filterJoints(p, rk, now) {
  if (rk.length < 17) rk = Array.from({length: 17}, () => [0, 0, 0]);
  const dt = Math.max(.016, Math.min(.25, (now - (p.lastJ || now - 50)) / 1000));
  p.lastJ = now;
  p.f = p.f || rk.map(() => null); p.kSeen = p.kSeen || rk.map(() => 0);
  p.k = p.k || rk.map(q => [q[0], q[1], 0]);
  rk.forEach((q, i) => {
    if (q[2] > 0) {
      const f = p.f[i];
      if (!f || now - p.kSeen[i] > 400) p.f[i] = {x: q[0], y: q[1], dx: 0, dy: 0};
      else euro(f, q[0], q[1], dt);
      p.k[i] = [p.f[i].x, p.f[i].y, q[2]]; p.kSeen[i] = now;
    } else if (now - p.kSeen[i] > HOLD_JOINT_MS) {
      p.k[i] = [p.k[i][0], p.k[i][1], 0];          // gone for real
    }                                               // else: hold the last position briefly
  });
}
function track() {
  const now = performance.now(), used = new Set();
  for (const r of raw) headSane(r.k);
  for (const r of raw) {
    const c = [r.b[0] + r.b[2] / 2, r.b[1] + r.b[3] / 2];
    let best = null, bd = .15;
    for (const p of people) {
      if (used.has(p)) continue;
      const d = Math.hypot(p.b[0] + p.b[2] / 2 - c[0], p.b[1] + p.b[3] / 2 - c[1]);
      if (d < bd) { bd = d; best = p; }
    }
    if (best) {
      filterBox(best, r.b, now); filterJoints(best, r.k, now); best.seen = now; used.add(best);
      if (ok(best, K.lan) || ok(best, K.ran)) best.feetSeen = now;
    } else {
      const p = {id: nextId++, seen: now, born: now, feetSeen: 0};
      filterBox(p, r.b, now); filterJoints(p, r.k, now); people.push(p); used.add(p);
    }
  }
  people = people.filter(p => now - p.seen < 600);   // ride out a missed frame or two
}

// ---- body geometry ---------------------------------------------------------
// Hits are judged on the tracked joints. If the part a circle needs isn't
// tracked right now (wrist out of view, head missed for a frame), the matching
// band of the person's box is used instead, so a missed joint never costs a hit.
const ok = (p, i) => p.k[i][2] > KP_CONF;
const pt = (p, i) => [p.k[i][0], p.k[i][1]];
// a hand point slightly past the wrist, along the forearm
function hands(p) {
  const out = [];
  for (const [w, e] of [[K.lwr, K.lel], [K.rwr, K.rel]]) {
    if (!ok(p, w)) continue;
    const [wx, wy] = pt(p, w);
    if (ok(p, e)) { const [ex, ey] = pt(p, e); out.push([wx + (wx - ex) * .3, wy + (wy - ey) * .3]); }
    else out.push([wx, wy]);
  }
  return out;
}
function head(p) {
  const idx = [0, 1, 2, 3, 4].filter(i => ok(p, i));
  if (!idx.length) return [];
  return [[idx.reduce((s, i) => s + p.k[i][0], 0) / idx.length, idx.reduce((s, i) => s + p.k[i][1], 0) / idx.length]];
}
const feet = p => [K.lan, K.ran].filter(i => ok(p, i)).map(i => pt(p, i));
// every visible joint plus points along each bone: "any part of the body"
function bodyPoints(p) {
  const out = p.k.filter(k => k[2] > KP_CONF).map(k => [k[0], k[1]]);
  for (const [a, b] of BONES) if (ok(p, a) && ok(p, b))
    for (const t of [.25, .5, .75]) out.push([p.k[a][0] + (p.k[b][0] - p.k[a][0]) * t, p.k[a][1] + (p.k[b][1] - p.k[a][1]) * t]);
  return out.concat(hands(p), head(p));
}
const partPoints = (p, part) => part === "hand" ? hands(p) : part === "head" ? head(p) : part === "foot" ? feet(p) : bodyPoints(p);
const JOINT_SLACK = 1.15;     // a joint counts slightly outside the drawn ring
const inCircle = (z, q, slack = JOINT_SLACK) => Math.hypot((q[0] - z.x) * AR, q[1] - z.y) <= z.r * slack;

// box bands, for parts the camera isn't tracking right now

function addZone(kind, part, z, now, extra = {}) {

    const feetVisible = ps.some(p => now - p.feetSeen < 1500);
    const roll = Math.random();
    const part = elapsed > HEAD_FROM_S && roll < .22 ? "head" : feetVisible && roll < .32 ? "foot" : "hand";
    const kind = part === "hand" && Math.random() < .14 ? "gold" : "grab";

function grabbed(z, now) {

    toast(`+${CLOCK_BONUS_S} seconds!`, col); burst(z, col, 30); chord([523, 784, 1046]);
    $("time").classList.add("plus"); setTimeout(() => $("time").classList.remove("plus"), 800);
    return;

  lastHitAt = now; stats.grabs++; stats.bestCombo = Math.max(stats.bestCombo, combo);

  if (z.kind === "duo") toast("Teamwork! x3", col);

  burst(z, col, z.kind === "grab" ? 24 : 44);

      z.active = who.size > 0;

  if (v(K.lsh) && v(K.rsh) && v(K.nose)) {
    cx.moveTo((X(K.lsh) + X(K.rsh)) / 2, (Y(K.lsh) + Y(K.rsh)) / 2); cx.lineTo(X(K.nose), Y(K.nose));
  }
  cx.strokeStyle = "rgba(30,122,255,.35)"; cx.lineWidth = lw * 2.6; cx.stroke();
  cx.strokeStyle = "#c8dcffdd"; cx.lineWidth = lw; cx.stroke();
  cx.fillStyle = "#c8dcff";
  for (let i = 5; i < 17; i++) if (v(i)) { cx.beginPath(); cx.arc(X(i), Y(i), lw * .7, 0, 7); cx.fill(); }
  // head ring and hand "cursors": the points that score
  const r = bodyScale(p) * R.h;
  for (const [hx, hy] of head(p)) {
    cx.strokeStyle = "#c8dcffcc"; cx.lineWidth = lw * .8; cx.beginPath(); cx.arc(R.x + hx * R.w, R.y + hy * R.h, r * .32, 0, 7); cx.stroke();
  }
  const hr = Math.max(6, r * .13);
  for (const [hx, hy] of hands(p)) {
    const X0 = R.x + hx * R.w, Y0 = R.y + hy * R.h;
    cx.fillStyle = "rgba(30,122,255,.3)"; cx.beginPath(); cx.arc(X0, Y0, hr * 1.9, 0, 7); cx.fill();
    cx.fillStyle = "#1e7aff"; cx.beginPath(); cx.arc(X0, Y0, hr, 0, 7); cx.fill();
  }
  cx.restore();
}
function drawZone(z, R, now) {
  const start = z.kind === "start", haz = z.kind === "hazard";
  const col = start ? COLORS.start : zoneColor(z);
  const life = start ? 0 : Math.min(1, (now - z.born) / z.life);
  const dying = !start && !z.done && life > .75;
  const pulse = .5 + .5 * Math.sin(now / (haz || dying ? 100 : 180));
  const pop = start ? 1 : Math.min(1, (now - z.born) / 220);
  let sc = .5 + .5 * (1 - Math.pow(1 - pop, 3)), a = 1;
  if (z.done) { const t = Math.min(1, (now - z.doneAt) / 450); a = 1 - t; sc *= z.missed ? 1 - t * .3 : 1 + t * .4; }
  if (dying) a *= .55 + .45 * pulse;
  const x = R.x + z.x * R.w, y = R.y + z.y * R.h, r = z.r * R.h * sc;
  cx.save(); cx.globalAlpha = a;
  // body: soft fill, glowing rim, brighter while being touched
  const g = cx.createRadialGradient(x, y, r * .2, x, y, r);
  g.addColorStop(0, col + (z.active ? "55" : "18")); g.addColorStop(1, col + (z.active ? "88" : "38"));
  cx.fillStyle = z.done && !z.missed ? col + "77" : g;
  cx.strokeStyle = col; cx.lineWidth = Math.max(3, r * .06) + pulse * 2;
  cx.shadowColor = col; cx.shadowBlur = 6 + pulse * 6 + (z.active ? 8 : 0);
  if (haz) cx.setLineDash([r * .25, r * .18]);
  cx.beginPath(); cx.arc(x, y, r, 0, 7); cx.fill(); cx.stroke();
  cx.setLineDash([]); cx.shadowBlur = 0;
  // life left: thin arc just outside
  if (!start && !z.done) {
    cx.strokeStyle = col + "99"; cx.lineWidth = Math.max(2, r * .04);
    cx.beginPath(); cx.arc(x, y, r * 1.12, -Math.PI / 2, -Math.PI / 2 + (1 - life) * Math.PI * 2); cx.stroke();
  }
  // hold progress: thick arc on the rim
  if (!haz && z.held > 0 && !z.done) {
    const hold = start ? HOLD_MS.start : z.kind === "duo" ? HOLD_MS.duo : HOLD_MS[z.part];
    cx.strokeStyle = "#ffffff"; cx.lineWidth = Math.max(5, r * .12); cx.shadowColor = col; cx.shadowBlur = 14;
    cx.beginPath(); cx.arc(x, y, r * .86, -Math.PI / 2, -Math.PI / 2 + Math.min(1, z.held / hold) * Math.PI * 2); cx.stroke();
    cx.shadowBlur = 0;
  }
  if (!z.done) {
    const fs = Math.max(12, r * .36);
    cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillStyle = "#ffffff";
    cx.shadowColor = "#000"; cx.shadowBlur = 6;
    let main = {hand: "HAND", head: "HEAD", foot: "FOOT"}[z.part] || "", sub = "";
    if (start) { main = "START"; sub = "hand"; }
    else if (haz) { main = "✕"; sub = "don't touch"; }
    else if (z.kind === "gold") sub = "x2";
    else if (z.kind === "clock") sub = "+5s";
    else if (z.kind === "duo") { main = "2 HANDS"; sub = `${Math.min(2, z.count || 0)}/2 people · x3`; }
    cx.font = `900 ${haz ? fs * 1.8 : fs}px ${MONO}`; cx.fillText(main, x, y - (sub ? fs * .25 : 0));
    if (sub) { cx.font = `700 ${fs * .5}px ${MONO}`; cx.fillText(sub, x, y + fs * .65); }
  }
  cx.restore();
}
function draw(now) {
  const d = devicePixelRatio || 1;
  if (cv.width !== innerWidth * d || cv.height !== innerHeight * d) { cv.width = innerWidth * d; cv.height = innerHeight * d; }
  cx.clearRect(0, 0, cv.width, cv.height);
  const R = videoRect();
  if (state === "attract" && startZone) drawZone(startZone, R, now);
  for (const z of zones) drawZone(z, R, now);
  for (const p of people) drawPerson(p, R, now);
  for (const p of parts) {
    const t = (now - p.t) / 1000; if (t > .9) continue;
    cx.globalAlpha = 1 - t / .9; cx.fillStyle = p.col;
    cx.beginPath();
    cx.arc(R.x + (p.x + p.vx * t) * R.w, R.y + (p.y + p.vy * t + .35 * t * t) * R.h, p.r * d, 0, 7);
    cx.fill();
  }
  parts = parts.filter(p => now - p.t < 900);
  for (const f of floaters) {
    const t = (now - f.t) / 1000; if (t > 1.2) continue;
    cx.globalAlpha = 1 - t / 1.2; cx.fillStyle = f.col;
    cx.font = `900 ${R.h * .06}px ${MONO}`; cx.textAlign = "center";
    cx.fillText(f.txt, R.x + f.x * R.w, R.y + f.y * R.h - t * R.h * .09);
    cx.shadowBlur = 0;
  }
  cx.globalAlpha = 1;
  floaters = floaters.filter(f => now - f.t < 1200);
}

let prev = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  if (now - prev < 30) return;                 // ~30 fps is plenty; halves the kiosk's CPU
  const dt = Math.min(100, now - prev); prev = now;
  try { update(now, dt); draw(now); } catch (e) { console.error(e); }
}
addEventListener("keydown", e => {
  if (e.code === "Space" && state === "attract") countdown();
  if (e.code === "Escape" && state === "play") endAt = performance.now();
});
addEventListener("click", () => { if (state === "attract") countdown(); });

toAttract(); poll(); requestAnimationFrame(frame);
</script>
