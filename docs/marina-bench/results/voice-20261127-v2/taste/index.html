<title>Marina Taste Test 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one chat at a time; user line full width, the two replies side by side per turn; verdict bar pinned at the bottom. */
:root {
  --bg: #f3f6f9; --panel: #ffffff; --fg: #1d2430; --muted: #5d6878; --line: #dbe2ea;
  --ice: #3f7fb4; --ice-soft: #e3eef7; --user: #e9edf2; --win: #2f8a5b; --win-soft: #e2f3ea;
  --display: "Outfit", "Avenir Next", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12161d; --panel: #1a2029; --fg: #e6ebf2; --muted: #95a1b2; --line: #2b3441;
  --ice: #7fb6e2; --ice-soft: #1f3142; --user: #242c37; --win: #5cc893; --win-soft: #1b3428; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12161d; --panel: #1a2029; --fg: #e6ebf2; --muted: #95a1b2; --line: #2b3441;
  --ice: #7fb6e2; --ice-soft: #1f3142; --user: #242c37; --win: #5cc893; --win-soft: #1b3428; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55 }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 140px; display: grid; gap: 20px }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px }
h1 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; margin: 0; letter-spacing: -0.01em; text-wrap: balance }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 62ch }
.progress { display: grid; gap: 6px; min-width: 220px }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--ice); width: 0; transition: width .2s }
.meta { font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums }
.dots { display: flex; flex-wrap: wrap; gap: 4px }
.dots button { width: 22px; height: 22px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: 500 10px var(--mono); cursor: pointer; padding: 0 }
.dots button.done { background: var(--ice-soft); color: var(--ice); border-color: transparent }
.dots button.cur { outline: 2px solid var(--ice); outline-offset: 1px }
.scen { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap }
.scen h2 { font-family: var(--display); font-weight: 600; font-size: 1.3rem; margin: 0 }
.tag { font: 500 11px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 8px }
.cols div { font: 600 13px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--ice); padding-left: 2px }
.turn { display: grid; gap: 10px }
.u { justify-self: end; max-width: min(560px, 85%); background: var(--user); padding: 9px 14px; border-radius: 14px 14px 4px 14px }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.r { background: var(--panel); border: 1px solid var(--line); border-radius: 4px 14px 14px 14px; padding: 11px 14px; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; transition: border-color .15s, background .15s }
.r em { color: var(--muted) }
.r .wc { display: block; margin-top: 6px; font: 500 11px var(--mono); color: var(--muted) }
.pair.pickA .r.a, .pair.pickB .r.b { border-color: var(--win); background: var(--win-soft) }
.verdict { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px) }
.verdict .in { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.btn { font: 600 14px var(--body); border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 9px 16px; border-radius: 10px; cursor: pointer }
.btn:hover { border-color: var(--ice) }
.btn:focus-visible, .dots button:focus-visible, input:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px }
.btn.on { background: var(--ice); color: var(--panel); border-color: var(--ice) }
.btn kbd { font: 500 11px var(--mono); opacity: .7; margin-left: 6px }
.nav { margin-left: auto; display: flex; gap: 8px }
#note { flex: 1 1 220px; min-width: 0; font: 14px var(--body); padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg) }
.results { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 16px }
.results h2 { font-family: var(--display); margin: 0; font-size: 1.4rem }
.tally { display: flex; flex-wrap: wrap; gap: 24px }
.tally div { display: grid }
.tally b { font: 700 2rem var(--display); font-variant-numeric: tabular-nums }
.tally span { color: var(--muted); font-size: 13px }
.tbl { overflow-x: auto }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line) }
th { font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.agree { color: var(--win) } .disagree { color: var(--muted) }
@media (max-width: 700px) {
  .pair, .cols { grid-template-columns: 1fr }
  .cols { display: none }
  .r.a::before, .r.b::before { display: block; font: 600 11px var(--display); letter-spacing: .06em; color: var(--ice); margin-bottom: 4px }
  .r.a::before { content: "LEFT" } .r.b::before { content: "RIGHT" }
  .nav { margin-left: 0 }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
.ctx{opacity:.6;font-size:.85em;margin:0 0 .6em}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Marina Taste Test 2</h1>
      <p class="sub">One message at a time, each answered by plain Gemma and by the new adapter (trained on your picks). Sides are shuffled and unlabelled. Pick the Marina you like more; the names show once every reply is judged.</p>
    </div>
    <div class="progress">
      <div class="meta" id="count">0 of 30 judged</div>
      <div class="bar"><i id="fill"></i></div>
      <div class="dots" id="dots"></div>
    </div>
  </header>
  <div class="scen"><span class="tag" id="pos">Chat 1</span><h2 id="scen">Loading chats…</h2><span class="tag" id="run"></span></div>
  <div class="cols"><div>Left</div><div>Right</div></div>
  <div id="chat" class="turn"></div>
  <section class="results" id="results" hidden></section>
</div>

<div class="verdict"><div class="in">
  <button class="btn" id="pA" type="button">Prefer left<kbd>1</kbd></button>
  <button class="btn" id="pT" type="button">Tie<kbd>2</kbd></button>
  <button class="btn" id="pB" type="button">Prefer right<kbd>3</kbd></button>
  <input id="note" placeholder="Why? (optional)" autocomplete="off">
  <div class="nav">
    <button class="btn" id="prev" type="button">←</button>
    <button class="btn" id="next" type="button">→</button>
    <button class="btn" id="show" type="button">Results</button>
  </div>
</div></div>

<script>
const KEY = 'marina-taste-v2-single';
const NAMES = { plain: 'Plain Gemma', voice: 'New adapter' };
const SCEN = { home_life: 'Home life', are_you_real: 'Are you real?', small_talk_loop: 'Small-talk loop', hackclub_news: 'Hack Club news', low_mood: 'Low mood', drive_the_chat: 'Drive the chat', opinion_pushback: 'Opinion pushback', teasing: 'Teasing', good_morning: 'Good morning', coding_mate: 'Coding mate' };
let chats = [], st = { order: null, picks: {}, notes: {}, at: 0 }, showResults = false;
const $ = (id) => document.getElementById(id);
const load = () => { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) st = Object.assign(st, s); } catch (e) {} };
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const fmt = (s) => esc(s.trim()).replace(/\*([^*\n]+)\*/g, '<em>*$1*</em>');
const words = (s) => (s.trim().match(/\S+/g) || []).length;

function sideOf(i) { return st.order[i] ? ['voice', 'plain'] : ['plain', 'voice']; }  // [left, right]

function render() {
  const c = chats[st.at], [L, R] = sideOf(st.at), pick = st.picks[st.at];
  $('pos').textContent = `Reply ${st.at + 1} of ${chats.length}`;
  $('scen').textContent = SCEN[c.scenario] || c.scenario;
  $('run').textContent = `run ${c.run}`;
  $('chat').innerHTML = (c.ctx && c.ctx.length ? '<div class="ctx">Earlier they said: ' + c.ctx.map(esc).join(' · ') + '</div>' : '') + c.user.map((u, t) => `
    <div class="turn"><div class="u">${esc(u)}</div>
    <div class="pair ${pick === 'L' ? 'pickA' : pick === 'R' ? 'pickB' : ''}">
      <div class="r a">${fmt(c[L][t] || '(no reply)')}<span class="wc">${words(c[L][t] || '')} words</span></div>
      <div class="r b">${fmt(c[R][t] || '(no reply)')}<span class="wc">${words(c[R][t] || '')} words</span></div>
    </div></div>`).join('');
  $('pA').classList.toggle('on', pick === 'L'); $('pB').classList.toggle('on', pick === 'R'); $('pT').classList.toggle('on', pick === 'T');
  $('note').value = st.notes[st.at] || '';
  const n = Object.keys(st.picks).length;
  $('count').textContent = `${n} of ${chats.length} judged`;
  $('fill').style.width = (100 * n / chats.length) + '%';
  $('dots').innerHTML = chats.map((_, i) => `<button type="button" class="${st.picks[i] ? 'done' : ''} ${i === st.at ? 'cur' : ''}" data-i="${i}" aria-label="Chat ${i + 1}">${i + 1}</button>`).join('');
  $('results').hidden = !(showResults || n === chats.length);
  if (!$('results').hidden) renderResults();
}

function winner(i) {
  const p = st.picks[i]; if (!p) return null; if (p === 'T') return 'tie';
  const [L, R] = sideOf(i); return p === 'L' ? L : R;
}

function renderResults() {
  const n = Object.keys(st.picks).length, done = n === chats.length;
  const t = { plain: 0, voice: 0, tie: 0 }, judgeT = { plain: 0, voice: 0, tie: 0 }, by = {};
  let agree = 0, both = 0;
  chats.forEach((c, i) => {
    const j = c.judge === 'marina' ? 'plain' : c.judge === 'marina-voice' ? 'voice' : 'tie'; judgeT[j]++;
    const w = winner(i); if (!w) return;
    t[w]++; both++; if (w === j) agree++;
    const s = (by[c.scenario] = by[c.scenario] || { plain: 0, voice: 0, tie: 0 }); s[w]++;
  });
  if (!done) {
    $('results').innerHTML = `<h2>Not finished yet</h2><p class="sub">${chats.length - n} chats left. The names stay hidden until every chat has a pick, so they don't sway the rest.</p>`;
    return;
  }
  $('results').innerHTML = `
    <h2>Your picks</h2>
    <div class="tally">
      <div><b>${t.plain}</b><span>${NAMES.plain}</span></div>
      <div><b>${t.voice}</b><span>${NAMES.voice}</span></div>
      <div><b>${t.tie}</b><span>Ties</span></div>
      <div><b>${agree}/${both}</b><span>Same call as the Qwen judge</span></div>
    </div>
    <p class="sub">Scoring by your pick patterns gave ${judgeT.plain} plain, ${judgeT.voice} adapter, ${judgeT.tie} tie.</p>
    <div class="tbl"><table><thead><tr><th>Scenario</th><th>Plain</th><th>Adapter</th><th>Tie</th></tr></thead><tbody>
    ${Object.keys(by).map((k) => `<tr><td>${SCEN[k] || k}</td><td>${by[k].plain}</td><td>${by[k].voice}</td><td>${by[k].tie}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="tbl"><table><thead><tr><th>#</th><th>Scenario</th><th>Run</th><th>You</th><th>Judge</th><th>Note</th></tr></thead><tbody>
    ${chats.map((c, i) => { const w = winner(i), j = c.judge === 'marina' ? 'plain' : c.judge === 'marina-voice' ? 'voice' : 'tie';
      return `<tr><td>${i + 1}</td><td>${SCEN[c.scenario] || c.scenario}</td><td>${c.run}</td><td>${w === 'tie' ? 'Tie' : NAMES[w]}</td><td class="${w === j ? 'agree' : 'disagree'}">${j === 'tie' ? 'Tie' : NAMES[j]}</td><td>${esc(st.notes[i] || '')}</td></tr>`; }).join('')}
    </tbody></table></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="copy" type="button">Copy results</button><button class="btn" id="reset" type="button">Start over</button><span class="meta" id="copied"></span></div>
    <textarea id="copytext" readonly hidden style="width:100%;min-height:120px"></textarea>`;
  const text = 'Marina taste test\n' + `plain ${t.plain}, adapter ${t.voice}, tie ${t.tie}\n` +
    chats.map((c, i) => `${i + 1}. ${c.scenario} run ${c.run}: ${winner(i)}${st.notes[i] ? ' — ' + st.notes[i] : ''}`).join('\n');
  $('copy').onclick = () => {
    navigator.clipboard.writeText(text).then(() => { $('copied').textContent = 'Copied'; })
      .catch(() => { const ta = $('copytext'); ta.hidden = false; ta.value = text; ta.select(); $('copied').textContent = 'Select and copy the text below'; });
  };
  let armed = false;
  $('reset').onclick = () => {
    if (!armed) { armed = true; $('reset').textContent = 'Click again to erase all picks'; return; }
    st = { order: shuffle(), picks: {}, notes: {}, at: 0 }; showResults = false; save(); render(); scrollTo(0, 0);
  };
}

function pick(p) {
  st.picks[st.at] = p; save();
  const next = chats.findIndex((_, i) => i > st.at && !st.picks[i]);
  const any = next >= 0 ? next : chats.findIndex((_, i) => !st.picks[i]);
  render();
  if (any >= 0) setTimeout(() => go(any), 350);
  else { showResults = true; render(); $('results').scrollIntoView({ behavior: 'smooth' }); }
}
function go(i) { st.at = Math.max(0, Math.min(chats.length - 1, i)); save(); render(); scrollTo(0, 0); }
function shuffle() { return chats.map(() => Math.random() < 0.5); }

$('pA').onclick = () => pick('L'); $('pB').onclick = () => pick('R'); $('pT').onclick = () => pick('T');
$('prev').onclick = () => go(st.at - 1); $('next').onclick = () => go(st.at + 1);
$('show').onclick = () => { showResults = true; render(); $('results').scrollIntoView({ behavior: 'smooth' }); };
$('dots').onclick = (e) => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); };
$('note').oninput = (e) => { st.notes[st.at] = e.target.value; save(); };
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.metaKey || e.ctrlKey) return;
  if (e.key === '1') pick('L'); else if (e.key === '2') pick('T'); else if (e.key === '3') pick('R');
  else if (e.key === 'ArrowLeft') go(st.at - 1); else if (e.key === 'ArrowRight') go(st.at + 1);
});

fetch('chats.json').then((r) => r.json()).then((d) => {
  chats = d; load();
  // Cut to 30 replies, keeping every one already judged (picks are kept by index).
  const LIMIT = 30;
  if (chats.length > LIMIT) {
    // Picks saved after an earlier cut are keyed by position in that cut: put them back
    // on the full list's indices (st.keep says which; the first cut kept replies 0-29).
    if (Array.isArray(st.order) && st.order.length < chats.length) {
      const ks = Array.isArray(st.keep) ? st.keep : st.order.map((_, j) => j);
      const order = chats.map(() => Math.random() < 0.5), p = {}, n = {};
      ks.forEach((i, j) => { order[i] = st.order[j]; if (st.picks[j]) p[i] = st.picks[j]; if (st.notes[j]) n[i] = st.notes[j]; });
      st.order = order; st.picks = p; st.notes = n;
    }
    const had = Array.isArray(st.order) && st.order.length === chats.length;
    const done = had ? chats.map((_, i) => i).filter((i) => st.picks[i]) : [];
    // Each message ran three times; after the judged ones, take only messages not seen yet.
    const seen = new Set(done.map((i) => chats[i].scenario + '|' + chats[i].user[0]));
    const fresh = chats.map((_, i) => i).filter((i) => {
      if (had && st.picks[i]) return false;
      const k = chats[i].scenario + '|' + chats[i].user[0];
      if (seen.has(k)) return false; seen.add(k); return true;
    });
    if (!st.target) st.target = done.length + 10;   // the ones already judged, plus 10 new
    const keep = done.concat(fresh).slice(0, Math.max(st.target, done.length));
    chats = keep.map((i) => chats[i]);
    if (had) {
      const p = {}, n = {};
      keep.forEach((i, j) => { if (st.picks[i]) p[j] = st.picks[i]; if (st.notes[i]) n[j] = st.notes[i]; });
      st.order = keep.map((i) => st.order[i]); st.picks = p; st.notes = n; st.keep = keep;
      st.at = Math.max(0, chats.findIndex((_, j) => !p[j])); save();
    }
  }
  if (!Array.isArray(st.order) || st.order.length !== chats.length) { st.order = shuffle(); st.picks = {}; st.notes = {}; st.at = 0; save(); }
  render();
}).catch(() => { $('scen').textContent = 'Could not load the chats. Reload the page to try again.'; });
</script>
